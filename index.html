<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnboardIQ — HR Onboarding Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<!-- Firebase (cloud sync) — same SDK set as the Role Profiler, plus Storage for large files -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<script>
  // Day/Night mode: apply the person's saved choice before the page paints (no flash)
  try { var _t = localStorage.getItem('onboardiq_theme'); if (_t === 'dark' || _t === 'light') document.documentElement.setAttribute('data-theme', _t); } catch (e) {}
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --coral:      #E8553E;
    --coral-dark: #C43B28;
    --coral-soft: #FDECEA;
    --coral-mid:  #F5A090;
    --bg:     #FFFFFF;
    --bg2:    #FDF8F6;
    --bg3:    #F7EEE9;
    --border: rgba(232, 85, 62, 0.13);
    --border2: rgba(232, 85, 62, 0.24);
    --border-gray: rgba(0,0,0,0.09);
    --text:  #1F1410;
    --text2: #6B5650;
    --text3: #B09890;
    --blue-bg:   #EAF2FF;
    --blue-text: #1B5FC4;
    --green-bg:  #E6F5EC;
    --green-text:#1A7A3A;
    --amber-bg:  #FEF5DC;
    --amber-text:#8A6000;
    --red-bg:    #FDECEA;
    --red-text:  #C0281A;
    --gray-bg:   #F2EDE9;
    --gray-text: #6B5650;
    --accent: #E8553E;
    --accent-hover: #C43B28;
    --radius:    10px;
    --radius-lg: 16px;
    --sidebar-w: 232px;
    --topbar-h:  60px;
    --shadow-sm: 0 1px 4px rgba(232,85,62,0.07), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 18px rgba(232,85,62,0.10), 0 2px 6px rgba(0,0,0,0.05);
    --soft-a: #FDF0ED;
    --soft-b: #FEF5F3;
    --req-bg: #FFF0EE;
    --todo-bg: #FDE8D7;
    --todo-text: #B4541A;
    --todo-border: #F4C29B;
    --auth-a: #FDF0EC;
    --auth-b: #F7E8E2;
  }

  /* Night mode — follows the device setting unless the person picks Day/Night with the toggle */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:     #1A1210;
      --bg2:    #221816;
      --bg3:    #2A1F1C;
      --border: rgba(232,85,62,0.15);
      --border2: rgba(232,85,62,0.28);
      --border-gray: rgba(255,255,255,0.08);
      --text:   #F5EDE8;
      --text2:  #C4A898;
      --text3:  #7A5E56;
      --blue-bg:   #192845;
      --blue-text: #78AAEE;
      --green-bg:  #0E2818;
      --green-text:#5ECC7E;
      --amber-bg:  #2A1C00;
      --amber-text:#F0BA40;
      --red-bg:    #2A100C;
      --red-text:  #F07468;
      --gray-bg:   #2A1F1C;
      --gray-text: #C4A898;
      --coral-soft:#2A1510;
      --soft-a: #2A1714;
      --soft-b: #231512;
      --req-bg: #2E1512;
      --todo-bg: #3A2210;
      --todo-text: #F4A261;
      --todo-border: #6B4020;
      --auth-a: #1A1210;
      --auth-b: #2A1F1C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
      --bg:     #1A1210;
      --bg2:    #221816;
      --bg3:    #2A1F1C;
      --border: rgba(232,85,62,0.15);
      --border2: rgba(232,85,62,0.28);
      --border-gray: rgba(255,255,255,0.08);
      --text:   #F5EDE8;
      --text2:  #C4A898;
      --text3:  #7A5E56;
      --blue-bg:   #192845;
      --blue-text: #78AAEE;
      --green-bg:  #0E2818;
      --green-text:#5ECC7E;
      --amber-bg:  #2A1C00;
      --amber-text:#F0BA40;
      --red-bg:    #2A100C;
      --red-text:  #F07468;
      --gray-bg:   #2A1F1C;
      --gray-text: #C4A898;
      --coral-soft:#2A1510;
      --soft-a: #2A1714;
      --soft-b: #231512;
      --req-bg: #2E1512;
      --todo-bg: #3A2210;
      --todo-text: #F4A261;
      --todo-border: #6B4020;
      --auth-a: #1A1210;
      --auth-b: #2A1F1C;
      color-scheme: dark;
  }

  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg3);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .app { display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .sidebar-logo {
    padding: 20px 18px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo-mark {
    display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
  }
  .sidebar-logo-icon {
    width: 36px; height: 36px; border-radius: 11px;
    background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 17px; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(232,85,62,0.35);
  }
  .sidebar-logo h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
  .sidebar-logo p  { font-size: 11px; color: var(--text3); margin-top: 1px; padding-left: 46px; }

  .nav { padding: 10px; flex: 1; }
  .nav-group { margin-bottom: 20px; }
  .nav-group-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.09em; color: var(--text3); padding: 0 8px 8px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: var(--radius); cursor: pointer;
    font-size: 13px; font-weight: 500; color: var(--text2);
    transition: background 0.14s, color 0.14s;
    user-select: none; position: relative;
  }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { background: var(--coral-soft); color: var(--coral); }
  .nav-item.active i { color: var(--coral); }
  .nav-item i { font-size: 17px; flex-shrink: 0; }
  .nav-badge {
    margin-left: auto; background: var(--red-bg); color: var(--red-text);
    font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 20px;
  }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg3); }
  .topbar {
    height: var(--topbar-h); padding: 0 28px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; background: var(--bg);
    box-shadow: var(--shadow-sm);
  }
  .topbar h2 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .topbar-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 13px; border-radius: var(--radius);
    border: 1px solid var(--border-gray); background: transparent;
    color: var(--text2); font-size: 12px; font-weight: 500; cursor: pointer;
    font-family: inherit; transition: background 0.13s, border-color 0.13s;
  }
  .topbar-btn:hover { background: var(--bg2); border-color: var(--border2); }
  .theme-toggle { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border2); background: var(--bg); color: var(--text2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .theme-toggle:hover { color: var(--coral); border-color: var(--coral); }
  .theme-toggle.on-auth { position: fixed; top: 16px; right: 16px; z-index: 50; }
  .sync-badge { font-family: inherit; font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg2); color: var(--text3); cursor: pointer; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .sync-badge[data-state="green"] { color: var(--green-text); background: var(--green-bg); border-color: transparent; }
  .sync-badge[data-state="amber"] { color: var(--amber-text); background: var(--amber-bg); border-color: transparent; }
  .sync-badge[data-state="red"]   { color: var(--red-text); background: var(--red-bg); border-color: transparent; }
  @media (max-width: 480px) { .sync-badge { max-width: 92px; } }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(232,85,62,0.3);
  }
  .content { flex: 1; overflow-y: auto; padding: 24px 28px; }

  .panel { display: none; }
  .panel.active { display: block; }

  /* Metrics */
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .metric-card {
    background: var(--bg); border-radius: var(--radius-lg);
    padding: 18px 20px; box-shadow: var(--shadow-sm);
    border: 1px solid var(--border); position: relative; overflow: hidden;
  }
  .metric-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--coral), var(--coral-mid));
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  }
  .metric-card .label { font-size: 11px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .metric-card .val { font-size: 28px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; color: var(--text); }
  .metric-card .sub { font-size: 11px; color: var(--green-text); margin-top: 6px; font-weight: 500; }
  .metric-card .sub.amber { color: var(--amber-text); }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .section-title {
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--text3);
    margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;
  }
  .section-title-btn {
    font-size: 12px; padding: 5px 12px; border-radius: var(--radius);
    border: 1px solid var(--border-gray); background: var(--bg);
    color: var(--text2); cursor: pointer; font-family: inherit; font-weight: 500;
    text-transform: none; letter-spacing: 0; transition: background 0.13s, color 0.13s, border-color 0.13s;
  }
  .section-title-btn:hover { background: var(--coral-soft); color: var(--coral); border-color: var(--coral-mid); }

  .card {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 14px;
    box-shadow: var(--shadow-sm);
  }
  .card-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.1s; font-size: 13px;
  }
  .card-row:last-child { border-bottom: none; }
  .card-row:hover { background: var(--bg2); }
  .card-row > i { font-size: 17px; color: var(--text3); flex-shrink: 0; }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

  .chip { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; flex-shrink: 0; }
  .chip-blue   { background: var(--blue-bg);   color: var(--blue-text); }
  .chip-green  { background: var(--green-bg);  color: var(--green-text); }
  .chip-amber  { background: var(--amber-bg);  color: var(--amber-text); }
  .chip-red    { background: var(--red-bg);    color: var(--red-text); }
  .chip-gray   { background: var(--gray-bg);   color: var(--gray-text); }
  .chip-coral  { background: var(--coral-soft); color: var(--coral); }

  .progress-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 12px;
  }
  .progress-row:last-child { border-bottom: none; }
  .progress-name { flex: 0 0 110px; color: var(--text2); font-size: 12px; font-weight: 500; }
  .progress-track { flex: 1; background: var(--bg3); border-radius: 6px; height: 7px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 6px; transition: width 0.6s ease; }
  .progress-pct { flex: 0 0 36px; text-align: right; font-weight: 600; font-size: 12px; color: var(--text2); }

  .journey-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .j-avatar {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; flex-shrink: 0;
    box-shadow: 0 3px 10px rgba(232,85,62,0.3);
  }
  .step {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
  }
  .step:last-child { border-bottom: none; }
  .step-dot {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; flex-shrink: 0; margin-top: 1px; font-weight: 700;
  }
  .dot-done   { background: var(--green-bg);   color: var(--green-text); }
  .dot-active { background: var(--coral-soft); color: var(--coral); }
  .dot-pending{ background: var(--gray-bg);    color: var(--gray-text); }
  .step-body { flex: 1; }
  .step-title { font-size: 13px; font-weight: 600; }
  .step-desc { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .step-status { font-size: 11px; margin-top: 4px; }

  /* ── Onboarding checklist spotlight ── */
  .checklist-spotlight {
    position: relative; border-radius: calc(var(--radius-lg) + 4px); padding: 3px; margin-bottom: 8px;
    background: linear-gradient(135deg, var(--coral), #F4A261, var(--coral-dark));
    box-shadow: 0 10px 30px rgba(232,85,62,0.18);
    scroll-margin-top: 16px;
  }
  .checklist-spotlight.attn { animation: clGlow 1.6s ease-in-out 3; }
  @keyframes clGlow {
    0%,100% { box-shadow: 0 10px 30px rgba(232,85,62,0.18); }
    50%     { box-shadow: 0 0 0 8px rgba(232,85,62,0.18), 0 14px 40px rgba(232,85,62,0.35); }
  }
  .checklist-inner { background: var(--bg); border-radius: var(--radius-lg); overflow: hidden; }
  .checklist-head {
    padding: 18px 20px; background: linear-gradient(135deg, var(--soft-a), var(--soft-b));
    border-bottom: 1px solid rgba(232,85,62,0.15); display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .checklist-head .cl-title { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
  .checklist-head .cl-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .cl-bar { height: 8px; border-radius: 8px; background: rgba(232,85,62,0.12); overflow: hidden; margin-top: 10px; }
  .cl-bar > div { height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--coral), #F4A261); transition: width .8s; }
  .cl-count { font-size: 26px; font-weight: 800; color: var(--coral); line-height: 1; }
  .checklist-inner .step { padding: 16px 20px; transition: background .15s; }
  .checklist-inner .step.has-action { cursor: pointer; }
  .checklist-inner .step.has-action:hover { background: var(--bg2); }
  .step.step-todo { background: linear-gradient(90deg, rgba(244,162,97,0.10), rgba(244,162,97,0.02)); position: relative; }
  .step.step-todo::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #F4A261; }
  .step.step-todo .step-title { font-size: 14px; }
  .step.step-todo .step-status { color: var(--coral) !important; font-weight: 600; }
  .step.step-todo .inline-btn { background: var(--coral); color: #fff; }
  .todo-badge {
    display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 20px; vertical-align: 1px;
    background: var(--todo-bg); color: var(--todo-text); border: 1px solid var(--todo-border); font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  }
  .step.step-next { background: linear-gradient(90deg, rgba(232,85,62,0.08), rgba(232,85,62,0.02)); position: relative; }
  .step.step-next::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--coral); }
  .step.step-next .step-title { font-size: 14px; }
  .up-next-badge {
    display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 20px; vertical-align: 1px;
    background: var(--coral); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  }
  .step.step-next .inline-btn { background: var(--coral); color: #fff; animation: ctaPulse 1.8s ease-in-out infinite; }
  @keyframes ctaPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(232,85,62,0.45); } 50% { box-shadow: 0 0 0 7px rgba(232,85,62,0); } }
  .hero-cta {
    margin-top: 14px; display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 20px;
    background: #fff; color: var(--coral-dark); font-weight: 700; font-size: 13px; border: none; cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  .hero-cta:hover { transform: translateY(-1px); }
  @media (prefers-reduced-motion: reduce) {
    .checklist-spotlight.attn, .step.step-next .inline-btn { animation: none; }
  }

  .exam-q { padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .exam-q:last-child { border-bottom: none; }
  .q-text { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .exam-option {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 0; font-size: 13px; color: var(--text2); cursor: pointer;
  }
  .exam-option input { accent-color: var(--coral); cursor: pointer; }

  .search-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg2);
  }
  .search-bar i { color: var(--text3); font-size: 16px; }
  .search-bar input {
    flex: 1; border: none; background: transparent; font-size: 13px;
    color: var(--text); outline: none; font-family: inherit;
  }
  .search-bar input::placeholder { color: var(--text3); }

  .locked {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 220px; gap: 12px; color: var(--text3); text-align: center;
  }
  .locked i { font-size: 40px; opacity: 0.3; }
  .locked p { font-size: 13px; max-width: 260px; line-height: 1.6; }

  .inline-btn {
    padding: 6px 14px; border-radius: var(--radius);
    border: 1.5px solid var(--coral); background: transparent;
    color: var(--coral); font-size: 12px; cursor: pointer; font-family: inherit;
    font-weight: 600; flex-shrink: 0; transition: background 0.13s, color 0.13s;
  }
  .inline-btn:hover { background: var(--coral); color: #fff; }
  .submit-row { display: flex; gap: 8px; margin-top: 14px; }

  #toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--text); color: var(--bg);
    padding: 11px 18px; border-radius: var(--radius-lg);
    font-size: 13px; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s, transform 0.25s; transform: translateY(8px);
    z-index: 100; max-width: 300px; box-shadow: var(--shadow-md);
  }
  #toast.show { opacity: 1; pointer-events: auto; transform: translateY(0); }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(31,20,16,0.45); z-index: 200;
    align-items: center; justify-content: center;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-lg); width: 440px; max-width: 92vw;
    padding: 24px; box-shadow: var(--shadow-md);
  }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }

<script>
/* ── Data ── */
const ROLES = {
  admin:    { label: 'Admin',              initials: 'AD', nav: ['dashboard','journey','videos','forms','exams','assessments','audit','settings'] },
  hr:       { label: 'HR Manager',         initials: 'HR', nav: ['dashboard','journey','videos','forms','exams','assessments','audit'] },
  manager:  { label: 'Department Manager', initials: 'MG', nav: ['dashboard','videos','exams','assessments'] },
  employee: { label: 'Employee',           initials: 'EE', nav: ['journey','videos','forms','exams','assessments'] }
};

const NAV_META = {
  dashboard:   { icon: 'ti-layout-dashboard', label: 'Dashboard' },
  journey:     { icon: 'ti-map-2',            label: 'My Journey' },
  videos:      { icon: 'ti-player-play',      label: 'Training Videos' },
  forms:       { icon: 'ti-file-text',        label: 'Forms' },
  exams:       { icon: 'ti-school',           label: 'Exams' },
  assessments: { icon: 'ti-brain',            label: 'Personality Test' },
  audit:       { icon: 'ti-history',          label: 'Audit Log' },
  settings:    { icon: 'ti-settings',         label: 'Settings' }
};

const EMPLOYEES = [];

const AUDIT_LOG = [];
/* ── Audit log ──
   Every meaningful action is recorded here with who did it, their role, when, and the details.
   Persisted with the rest of the data, merged across tabs, kept for 90 days. */
const AUDIT_RETENTION_DAYS = 90;
const AUDIT_CATEGORIES = {
  Account:     { icon: 'ti-user',          color: 'var(--accent)' },
  Users:       { icon: 'ti-users',         color: 'var(--coral)' },
  Training:    { icon: 'ti-player-play',   color: 'var(--red-text)' },
  Exams:       { icon: 'ti-school',        color: 'var(--blue-text)' },
  Personality: { icon: 'ti-brain',         color: 'var(--amber-text)' },
  Forms:       { icon: 'ti-file-text',     color: 'var(--green-text)' },
  Settings:    { icon: 'ti-settings',      color: 'var(--text2)' },
  Export:      { icon: 'ti-download',      color: 'var(--text2)' }
};
function logAudit(category, action, detail, actorOverride) {
  const a = actorOverride || (currentUser ? { name: currentUser.name, username: currentUser.username, role: currentUser.role } : { name: 'System', username: '', role: '' });
  const now = new Date();
  AUDIT_LOG.push({
    id: 'a' + now.getTime() + '_' + Math.random().toString(36).slice(2, 7),
    at: now.toISOString(),
    time: now.toLocaleString(),
    category, action, detail: detail || '',
    actor: a.name || a.username || 'Unknown', actorUsername: a.username || '', actorRole: a.role || ''
  });
  pruneAudit();
  saveData(true); // write immediately so nothing is lost if the page closes right after
}
function pruneAudit() {
  const cutoff = Date.now() - AUDIT_RETENTION_DAYS * 864e5;
  for (let i = AUDIT_LOG.length - 1; i >= 0; i--) {
    const t = Date.parse(AUDIT_LOG[i].at);
    if (t && t < cutoff) AUDIT_LOG.splice(i, 1);
  }
}
// Activity recorded before the audit log existed only lived in notifications — carry it over once
// so the audit trail is complete when reviewed.
function backfillAuditFromNotifications() {
  let added = false;
  const map = {
    registration:    ['Account', 'Registered (awaiting approval)'],
    exam:            ['Exams', 'Submitted exam'],
    retake:          ['Personality', 'Requested personality test retake'],
    retake_approved: ['Personality', 'Retake approved'],
    retake_rejected: ['Personality', 'Retake declined']
  };
  NOTIFICATIONS.forEach(n => {
    const srcId = 'n' + n.id;
    if (AUDIT_LOG.some(x => x.srcId === srcId)) return;
    const [cat, action] = map[n.type] || ['Settings', 'Notification'];
    const parsed = Date.parse(n.time);
    const u = n.username ? USER_REGISTRY.find(x => x.username === n.username) : null;
    AUDIT_LOG.push({
      id: 'a' + srcId, srcId,
      at: parsed ? new Date(parsed).toISOString() : new Date(Number(n.id) || Date.now()).toISOString(),
      time: n.time, category: cat, action, detail: n.title + (n.sub ? ' · ' + n.sub : ''),
      actor: n.type === 'retake_approved' || n.type === 'retake_rejected' ? 'Admin / HR'
           : u ? u.name
           : n.type === 'registration' ? n.title.replace(/^New registration:\s*/, '')
           : (n.title.split(/ submitted | requested /)[0] || '—'),
      actorUsername: n.type.startsWith('retake_') ? '' : (n.username || ''), actorRole: n.type.startsWith('retake_') ? '' : 'employee'
    });
    added = true;
  });
  return added;
}

// { username, videoTitle, pct, done, lastWatched }
const VIDEO_WATCH_PROGRESS = [];

function getVideoProgress(username, videoTitle) {
  return VIDEO_WATCH_PROGRESS.find(p => p.username === username && p.videoTitle === videoTitle) || null;
}
const _progressSavedAt = {};
function setVideoProgress(username, videoTitle, pct, done, maxTime) {
  let p = VIDEO_WATCH_PROGRESS.find(p => p.username === username && p.videoTitle === videoTitle);
  if (!p) {
    p = { username, videoTitle, pct: 0, done: false, lastWatched: null };
    VIDEO_WATCH_PROGRESS.push(p);
  }
  const prevPct = p.pct;
  p.pct = Math.max(p.pct, pct);
  if (maxTime != null) p.maxTime = Math.max(p.maxTime || 0, maxTime);
  const wasDone = p.done;
  if (done) p.done = true;
  if (done && !wasDone && USER_REGISTRY.some(u => u.username === username && u.role === 'employee')) {
    const isWelcome = String(videoTitle).startsWith('welcome::');
    logAudit('Training', isWelcome ? 'Completed pre-board video' : 'Completed training video', `"${isWelcome ? videoTitle.slice(9) : videoTitle}"`);
  }
  p.lastWatched = new Date().toLocaleString();
  // Only persist when something meaningful changed — at most every 5 seconds while playing.
  const k = username + '|' + videoTitle;
  const now = Date.now();
  if ((done && !wasDone) || p.pct >= prevPct + 5 || !_progressSavedAt[k] || now - _progressSavedAt[k] > 5000) {
    _progressSavedAt[k] = now;
    saveData();
  }
}

/* ── Smooth video playback ──
   Videos are stored as base64 data URLs. Putting a multi-MB string straight into a <video src>
   (and re-injecting it on every re-render) makes playback stutter or fail. Instead each video
   is converted ONCE into an in-memory Blob URL and reused. */
function _fileSig(data) { return data ? (data.length + ':' + data.slice(0, 48) + ':' + data.slice(-48)) : ''; }
function playableUrl(obj) {
  if (obj && !obj.fileUrl && obj.fileId && FILE_INDEX[obj.fileId] && FILE_INDEX[obj.fileId].url) return Promise.resolve(FILE_INDEX[obj.fileId].url);
  if (!obj || !obj.fileUrl) return Promise.resolve('');
  const sig = _fileSig(obj.fileUrl);
  if (obj._blobUrl && obj._blobSig === sig) return Promise.resolve(obj._blobUrl);
  if (obj._blobPromise && obj._blobSig === sig) return obj._blobPromise;
  obj._blobSig = sig;
  obj._blobPromise = fetch(obj.fileUrl).then(r => r.blob()).then(b => {
    if (obj._blobUrl) { try { URL.revokeObjectURL(obj._blobUrl); } catch(e) {} }
    obj._blobUrl = URL.createObjectURL(b);
    return obj._blobUrl;
  }).catch(() => obj.fileUrl); // fall back to the data URL if conversion fails
  return obj._blobPromise;
}
// <video data-vsrc="welcome"> / <video data-vsrc="lib:3"> get their src filled in here.
function hydrateVideos(root) {
  if (!root) return;
  root.querySelectorAll('video[data-vsrc]').forEach(el => {
    const key = el.getAttribute('data-vsrc');
    const obj = key === 'welcome' ? WELCOME_VIDEO : VIDEO_LIBRARY[Number(key.split(':')[1])];
    playableUrl(obj).then(url => {
      if (!url || !el.isConnected) return;
      if (el.src !== url) { el.src = url; el.load(); }
      if (el._onReady) el._onReady();
    });
  });
}
// True while a video on the main page is mid-play — background sync must not re-render then,
// otherwise the video restarts from zero.
function videoBusy() {
  const vids = document.querySelectorAll('#main-content video');
  return Array.from(vids).some(v => !v.paused && !v.ended);
}

/* ── No skipping ahead ──
   New employees must watch each video through. They can rewind and re-watch freely, but can't
   seek past the furthest point they've actually watched (or speed the video up) until they've
   played it to the end once. Admin/HR/Managers can always seek freely to review content. */
function guardVideo(videoEl, opts) {
  const username = opts.username;
  const key = opts.key;
  const restricted = currentRole === 'employee' && !!username;
  const prev = username ? getVideoProgress(username, key) : null;
  let completed = !!(prev && prev.done);
  let maxT = prev && prev.maxTime ? prev.maxTime : 0;
  let warned = 0;
  if (restricted && !completed) {
    videoEl.setAttribute('controlsList', 'nodownload noplaybackrate');
    videoEl.disablePictureInPicture = true;
  }
  videoEl.addEventListener('loadedmetadata', () => {
    const d = videoEl.duration || 0;
    if (!maxT && prev && prev.pct && d) maxT = d * prev.pct / 100;   // older records saved only a %
    if (restricted && !completed && maxT > 1 && maxT < d - 2) videoEl.currentTime = maxT; // resume
  });
  videoEl.addEventListener('timeupdate', () => {
    const d = videoEl.duration;
    if (!d) return;
    // For restricted viewers any forward seek is reverted instantly, so every position reached
    // while not seeking was genuinely watched. For others, only count continuous playback.
    if (!videoEl.seeking && (restricted || videoEl.currentTime <= maxT + 2)) maxT = Math.max(maxT, videoEl.currentTime);
    const pct = Math.min(100, Math.round((maxT / d) * 100));
    if (opts.onProgress) opts.onProgress(completed ? 100 : pct);
    if (username && !completed) setVideoProgress(username, key, pct, false, maxT);
  });
  videoEl.addEventListener('seeking', () => {
    if (!restricted || completed) return;
    if (videoEl.currentTime > maxT + 1) {
      videoEl.currentTime = maxT;
      if (Date.now() - warned > 3000) { warned = Date.now(); toast('Please watch the video in full — skipping ahead is unlocked after you finish it once.'); }
    }
  });
  videoEl.addEventListener('ratechange', () => {
    if (restricted && !completed && videoEl.playbackRate > 1) videoEl.playbackRate = 1;
  });
  // A video counts as complete once it has been watched up to 30 seconds before the end
  // (very short videos, under a minute, must be watched to the end).
  const doneAt = d => d >= 60 ? d - 30 : d - 2;
  function markComplete() {
    const d = videoEl.duration || 0;
    if (completed || !username || !d) return;
    if (maxT < doneAt(d)) return; // not actually watched that far
    completed = true;
    videoEl.setAttribute('controlsList', 'nodownload');
    videoEl.disablePictureInPicture = false;
    setVideoProgress(username, key, 100, true, d);
    if (opts.onComplete) opts.onComplete();
  }
  videoEl.addEventListener('timeupdate', markComplete);
  videoEl.addEventListener('ended', markComplete);
}

  const reqDoneJ  = reqVidsJ.filter(v => { const p = getVideoProgress(username, v.title); return p && p.done; }).length;
  const allReqDone = reqVidsJ.length > 0 && reqDoneJ === reqVidsJ.length;
  const allVideosDone = totalVids > 0 && doneVids === totalVids;
  const videoStatus = totalVids === 0 ? 'pending' : (allReqDone && allVideosDone) ? 'done' : allReqDone ? 'active' : doneVids > 0 ? 'active' : 'active';
  const videoNote = totalVids === 0 ? 'No videos uploaded yet'
    : allVideosDone ? `All ${totalVids} videos watched ✓`

    : `${pendingExams} of ${totalExams} exam${totalExams!==1?'s':''} pending`;

  const myAssessment = ASSESSMENT_RESULTS.find(r => r.username === username) || null;
  const steps = [
    { s: videoStatus,   t: 'Training videos', d: hasVideos ? `${reqVidsJ.length} required · ${optVidsJ.length} optional · ${doneVids}/${totalVids} watched` : 'No videos uploaded yet', note: videoNote, action: hasVideos ? `<button class="inline-btn" onclick="renderNav('videos');renderPanel('videos')">Watch →</button>` : '' },

function panelVideos() {
  const username = currentUser ? currentUser.username : null;

  // ── Helper: build a circular SVG ring ──
  function ring(pct, done, isRequired) {
    const r = 16, circ = 2 * Math.PI * r;
    const offset = circ - (pct / 100) * circ;
    const color  = done ? 'var(--green-text)' : isRequired ? 'var(--red-text)' : 'var(--gray-text)';
    const iconClass = done ? 'ti-check' : 'ti-player-play';
    const iconColor = done ? 'var(--green-text)' : isRequired ? 'var(--red-text)' : 'var(--text3)';
    return `
    <div class="ring-wrap">
      <svg width="40" height="40" viewBox="0 0 40 40">
        <circle class="ring-bg"   cx="20" cy="20" r="${r}"/>
        <circle class="ring-fill" cx="20" cy="20" r="${r}"
          stroke="${color}"
          stroke-dasharray="${circ.toFixed(2)}"
          stroke-dashoffset="${(pct > 0 || done ? offset : circ).toFixed(2)}"/>
      </svg>
      ${pct > 0 && !done
        ? `<div class="ring-pct">${pct}%</div>`
        : `<div class="ring-icon"><i class="ti ${iconClass}" style="color:${iconColor};font-size:13px"></i></div>`}
    </div>`;
  }

  // ── Helper: build category banner with progress bar ──
  function catBanner(label, total, done, isRequired) {
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    const barColor = isRequired ? 'var(--red-text)' : 'var(--gray-text)';
    const bgColor  = isRequired ? 'var(--req-bg)' : 'var(--gray-bg)';
    const textColor= isRequired ? 'var(--red-text)' : 'var(--gray-text)';
    const icon     = isRequired ? 'ti-alert-circle' : 'ti-circle-check';
    return `
    <div class="cat-banner" style="background:${bgColor};border-color:${isRequired?'rgba(192,40,26,.15)':'rgba(107,86,80,.15)'}">
      <div style="width:44px;height:44px;border-radius:12px;background:${isRequired?'rgba(192,40,26,.1)':'rgba(107,86,80,.1)'};display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <i class="ti ${icon}" style="font-size:22px;color:${textColor}" aria-hidden="true"></i>
      </div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <div style="font-size:13px;font-weight:700;color:var(--text)">${label} videos</div>
          <div style="font-size:13px;font-weight:700;color:${textColor}">${pct}% complete</div>
        </div>
        <div style="background:rgba(0,0,0,.07);border-radius:6px;height:7px;overflow:hidden">
          <div style="height:100%;border-radius:6px;background:${barColor};width:${pct}%;transition:width .6s ease"></div>
        </div>
        <div style="font-size:11px;color:${textColor};margin-top:5px;opacity:.85">${done} of ${total} video${total!==1?'s':''} watched</div>
      </div>
    </div>`;
  }

  // ── Helper: build video rows for a category ──
  function videoRows(vids, isRequired) {
    if (!vids.length) return `<div style="padding:24px;text-align:center;color:var(--text3);font-size:13px">
      <i class="ti ti-video-off" style="font-size:28px;display:block;margin-bottom:8px;opacity:.3"></i>
      No ${isRequired?'required':'optional'} videos yet.
    </div>`;
    return vids.map(v => {
      const p = username ? getVideoProgress(username, v.title) : null;
      const pct  = p ? p.pct  : 0;
      const done = p ? p.done : false;
      const statusChip = done
        ? `<span class="chip chip-green" style="font-size:10px"><i class="ti ti-check" style="font-size:10px;vertical-align:-1px"></i> Done</span>`
        : pct > 0
          ? `<span class="chip ${isRequired?'chip-red':'chip-gray'}" style="font-size:10px">${pct}%</span>`
          : `<span class="chip chip-gray" style="font-size:10px">Not started</span>`;
      return `
      <div class="vid-card-item" onclick="openModal('video','${v.title.replace(/'/g,"\\'")}')">
        ${ring(pct, done, isRequired)}
        <div class="row-main" style="min-width:0">
          <div class="row-title">${v.title}</div>
          <div class="row-sub">${v.dept} · ${v.dur || '—'}</div>
        </div>
        ${statusChip}
      </div>`;
    }).join('');
  }

  // ── EMPLOYEE VIEW ──
  if (currentRole === 'employee') {
    if (!VIDEO_LIBRARY.length) return `
      <div class="section-title">Training Videos</div>
      <div style="text-align:center;color:var(--text3);padding:60px 0;font-size:13px">
        <i class="ti ti-video-off" style="font-size:36px;display:block;margin-bottom:10px;opacity:.3" aria-hidden="true"></i>
        No training videos uploaded yet. Check back soon.
      </div>`;

    const reqVids = VIDEO_LIBRARY.filter(v => v.tag === 'REQUIRED');
    const optVids = VIDEO_LIBRARY.filter(v => v.tag !== 'REQUIRED');

    const reqDone = reqVids.filter(v => { const p = getVideoProgress(username, v.title); return p && p.done; }).length;
    const optDone = optVids.filter(v => { const p = getVideoProgress(username, v.title); return p && p.done; }).length;
    const totalDone = reqDone + optDone;
    const totalVids = VIDEO_LIBRARY.length;
    const overallPct = totalVids > 0 ? Math.round((totalDone / totalVids) * 100) : 0;

    // Active tab stored on window so it survives re-renders
    if (!window._vidTab) window._vidTab = 'required';

// Admin: edit a training video's title, department, Required/Optional tag, or replace its file.
function saveVideoEdit(idx) {
  if (currentRole !== 'admin') { toast('Only Admin can edit video details'); return; }
  const v = VIDEO_LIBRARY[idx];
  if (!v) return;
  const title = document.getElementById('ev-title').value.trim();
  const dept  = document.getElementById('ev-dept').value;
  const tag   = document.getElementById('ev-tag').value;
  if (!title) { document.getElementById('ev-title').focus(); toast('Please enter a video title'); return; }
  if (VIDEO_LIBRARY.some((x, i) => i !== idx && x.title.toLowerCase() === title.toLowerCase())) { toast('Another video already uses that title'); return; }
  const btn = document.getElementById('ev-save');
  const file = window._evFile;
  const resetProgress = file && document.getElementById('ev-reset') && document.getElementById('ev-reset').checked;
  const apply = (dataUrl) => {
    const oldTitle = v.title;
    const changes = [];
    if (oldTitle !== title) changes.push(`title "${oldTitle}" → "${title}"`);
    if (v.dept !== dept) changes.push(`department ${v.dept} → ${dept}`);
    if (v.tag !== tag) changes.push(`${v.tag === 'REQUIRED' ? 'Required' : 'Optional'} → ${tag === 'REQUIRED' ? 'Required' : 'Optional'}`);
    if (dataUrl) changes.push('video file replaced' + (resetProgress ? ' (watch progress reset)' : ''));
    logAudit('Training', 'Edited training video', `"${title}" — ${changes.length ? changes.join('; ') : 'no changes'}`);
    // Watch progress is keyed by title — carry it over to the new title.
    if (oldTitle !== title) VIDEO_WATCH_PROGRESS.forEach(p => { if (p.videoTitle === oldTitle) p.videoTitle = title; });
    v.title = title; v.dept = dept; v.tag = tag;
    v.tagClass = tag === 'REQUIRED' ? 'chip-red' : 'chip-gray';
    if (dataUrl) {
      const oldFileId = v.fileId;
      v.fileId = newFileId();
      registerLocalFile(v.fileId, dataUrl, file.type || 'video/mp4', file.name);
      if (oldFileId) forgetFile(oldFileId);
      v.remoteUrl = null; v._blobUrl = null;
      v.fileUrl = dataUrl; v.fileData = dataUrl;
      v.mimeType = file.type || 'video/mp4';
      v.dur = (file.size / 1024 / 1024).toFixed(1) + ' MB';
      if (resetProgress) {
        _restoring = true;
        try { for (let i = VIDEO_WATCH_PROGRESS.length - 1; i >= 0; i--) if (VIDEO_WATCH_PROGRESS[i].videoTitle === title) VIDEO_WATCH_PROGRESS.splice(i, 1); }
        finally { _restoring = false; }
      }
    }
    saveData(true);
    closeModal();
    toast('Video details updated');
    if (currentPanel === 'videos' || currentPanel === 'journey' || currentPanel === 'dashboard') renderPanel(currentPanel);
  };
  if (file) {
    btn.disabled = true; btn.textContent = 'Saving…';
    fileToDataURL(file).then(apply).catch(() => { btn.disabled = false; btn.textContent = 'Save changes'; toast('Failed to read the video file'); });
  } else apply(null);
}

function deleteVideo(idx) {
  if (!confirm('Delete this video?')) return;
  if (VIDEO_LIBRARY[idx]) logAudit('Training', 'Deleted training video', `"${VIDEO_LIBRARY[idx].title}" · ${VIDEO_LIBRARY[idx].dept}`);
  dbDelete('video_' + idx).catch(() => {});
  if (VIDEO_LIBRARY[idx] && VIDEO_LIBRARY[idx].fileId) forgetFile(VIDEO_LIBRARY[idx].fileId);
  VIDEO_LIBRARY.splice(idx, 1);
  saveData();
  renderPanel('videos');
  toast('Video deleted');
}

function filterForms(q) {
  const query = q.trim().toLowerCase();
  const clearBtn = document.getElementById('form-search-clear');
  if (clearBtn) clearBtn.style.display = query ? 'block' : 'none';

  if (!query) {
    // Show all sections and rows
    document.querySelectorAll('#forms-list .form-entry').forEach(r => r.style.display = '');
    document.querySelectorAll('#forms-list .form-dept-section').forEach(s => s.style.display = '');
    const empty = document.getElementById('forms-empty');
    if (empty) empty.style.display = 'none';
    return;
  }

  let anyVisible = false;
  document.querySelectorAll('#forms-list .form-dept-section').forEach(section => {
    let sectionHasMatch = false;
    section.querySelectorAll('.form-entry').forEach(row => {
      const matches = row.dataset.search.includes(query);
      row.style.display = matches ? '' : 'none';
      if (matches) sectionHasMatch = true;
    });
    section.style.display = sectionHasMatch ? '' : 'none';
    if (sectionHasMatch) anyVisible = true;
  });

  const empty = document.getElementById('forms-empty');
  if (empty) empty.style.display = anyVisible ? 'none' : 'block';
}

function downloadForm(i) {
  const f = FORM_LIBRARY[i];
  if (!f) return;
  logAudit('Forms', 'Downloaded form', `"${f.title}" · ${f.filename}`);
  if (f.fileData) {
    // Real uploaded file — trigger actual download
    const a = document.createElement('a');
    a.href = f.fileData;
    a.download = f.filename;
    a.click();
  } else if (f.fileId && FILE_INDEX[f.fileId] && FILE_INDEX[f.fileId].url) {
    window.open(FILE_INDEX[f.fileId].url, '_blank');
  } else if (f.fileId && FILE_INDEX[f.fileId] && FILE_INDEX[f.fileId].cloud) {
    toast('Fetching the file from the cloud…');
    getFileData(f.fileId).then(d => {
      if (!d) { toast('Could not load this file — try again shortly'); return; }
      f.fileData = d;
      const a = document.createElement('a'); a.href = d; a.download = f.filename; a.click();
    });
  } else {
    // Placeholder form — simulate download
    toast(`Downloading ${f.filename}…`);
  }
}

function deleteForm(i) {
  const f = FORM_LIBRARY[i];
  if (!f) return;
  if (!confirm(`Delete "${f.title}"? This cannot be undone.`)) return;
  logAudit('Forms', 'Deleted form', `"${f.title}" · ${f.version || ''}`);
  const key = f.dbKey || (f.id ? 'form_' + f.id : null);
  if (key) dbDelete(key).catch(() => {});
  if (f.fileId) forgetFile(f.fileId);
  FORM_LIBRARY.splice(i, 1);
  saveData(true);
  renderPanel('forms');
  toast(`"${f.title}" deleted`);
}

function openExamTake(examIdx) {
  const ex = EXAM_LIBRARY[examIdx];
  if (!ex) return;
  const username = currentUser?.username || 'unknown';
  const existing = EXAM_SUBMISSIONS.find(s => s.username === username && s.examIdx === examIdx);
  document.getElementById('page-title').textContent = ex.name;
  // Support both old (single int) and new (array) correct format
  function initAnswers() {
    return ex.questions.map((q, qi) => {
      if (existing) return existing.answers[qi] !== undefined ? existing.answers[qi] : -1;
      const isMulti = Array.isArray(q.correct) && q.correct.length > 1;
      return isMulti ? [] : -1;
    });
  }
  const answers = initAnswers();

  function render() {
    document.getElementById('main-content').innerHTML = `
    <div style="max-width:640px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
        <button class="topbar-btn" onclick="renderNav('exams');renderPanel('exams')">← Back to exams</button>
        ${existing ? `<span class="chip ${existing.passed?'chip-green':'chip-red'}" style="margin-left:auto">${existing.passed?'Passed':'Failed'} · ${existing.score}%</span>` : ''}
      </div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:16px">${ex.dept} · ${ex.questions.length} questions · Pass threshold: ${ex.pass}%</div>
      <div class="card" style="margin-bottom:14px">
        ${ex.questions.map((q, qi) => {
          const correctArr = Array.isArray(q.correct) ? q.correct : [q.correct];
          const isMulti = correctArr.length > 1;
          const curAns = answers[qi];
          const selectedArr = Array.isArray(curAns) ? curAns : (curAns === -1 ? [] : [curAns]);
          return `
          <div class="exam-q" id="exq-${qi}">
            <div class="q-text">${qi+1}. ${q.text}${isMulti ? ' <span style="font-size:10px;color:var(--accent);font-weight:500">(select all that apply)</span>' : ''}</div>
            ${q.choices.map((c, ci) => {
              const isSelected = selectedArr.includes(ci);
              const isCorrect  = existing && correctArr.includes(ci);
              const isWrong    = existing && isSelected && !correctArr.includes(ci);
              if (isMulti) {
                return `<label class="exam-option" style="${isCorrect&&existing?'color:var(--green-text);font-weight:500':isWrong?'color:var(--red-text)':''}">
                  <input type="checkbox" value="${ci}" ${isSelected?'checked':''} ${existing?'disabled':''} onchange="examAnswerToggle(${qi},${ci},this.checked)" style="accent-color:var(--accent);cursor:pointer">
                  ${c}${isCorrect&&existing?' ✓':''}${isWrong?' ✗':''}
                </label>`;
              } else {
                return `<label class="exam-option" style="${isCorrect&&existing?'color:var(--green-text);font-weight:500':isWrong?'color:var(--red-text)':''}">
                  <input type="radio" name="eq-${qi}" value="${ci}" ${isSelected?'checked':''} ${existing?'disabled':''} onchange="examAnswer(${qi},${ci})">
                  ${c}${isCorrect&&existing?' ✓':''}${isWrong?' ✗':''}
                </label>`;
              }
            }).join('')}
          </div>`;
        }).join('')}
      </div>
      ${!existing ? `
      <div class="submit-row">
        <button class="inline-btn" onclick="submitExamAnswers(${examIdx})" style="flex:1;padding:10px">Submit exam</button>
        <button class="topbar-btn" onclick="renderNav('exams');renderPanel('exams')">Cancel</button>
      </div>` : ''}
    </div>`;
    window._examAnswers = answers;
  }

  window.examAnswer = (qi, ci) => { window._examAnswers[qi] = ci; };
  window.examAnswerToggle = (qi, ci, checked) => {
    if (!Array.isArray(window._examAnswers[qi])) window._examAnswers[qi] = [];
    if (checked) { if (!window._examAnswers[qi].includes(ci)) window._examAnswers[qi].push(ci); }
    else { window._examAnswers[qi] = window._examAnswers[qi].filter(x => x !== ci); }
  };
  render();
}

function submitExamAnswers(examIdx) {
  const ex = EXAM_LIBRARY[examIdx];
  const answers = window._examAnswers || [];
  const username = currentUser?.username || 'unknown';
  const unanswered = answers.findIndex(a => (Array.isArray(a) ? a.length === 0 : a === -1));
  if (unanswered !== -1) { toast(`Please answer question ${unanswered+1} before submitting`); return; }

  let correct = 0;
  answers.forEach((ans, i) => {
    const q = ex.questions[i];
    const correctArr = Array.isArray(q.correct) ? q.correct : [q.correct];
    const selectedArr = Array.isArray(ans) ? ans : (ans === -1 ? [] : [ans]);
    const isCorrect = correctArr.length === selectedArr.length &&
      correctArr.every(c => selectedArr.includes(c));
    if (isCorrect) correct++;
  });
  const score = Math.round((correct / ex.questions.length) * 100);
  const passed = score >= ex.pass;

  EXAM_SUBMISSIONS.push({ sid: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), username, examIdx, answers: [...answers], score, passed, submittedAt: new Date().toLocaleString() });

  logAudit('Exams', 'Submitted exam', `"${ex.name}" · Score ${score}% · ${passed ? 'Passed' : 'Failed'} (pass mark ${ex.pass}%)`);
  // Notify admin
  NOTIFICATIONS.push({
    id: Date.now(), type: 'exam',
    title: `${currentUser?.name || username} submitted "${ex.name}"`,
    sub: `Score: ${score}% · ${passed?'Passed':'Failed'}`,
    time: new Date().toLocaleString(), read: false
  });
  updateBell();

  toast(`Submitted! You scored ${score}% — ${passed ? '✓ Passed' : '✗ Failed (pass mark: '+ex.pass+'%)'}`);
  setTimeout(() => openExamTake(examIdx), 200); // re-render with results
}

            <label style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px">Pass threshold (%)</label>
            <input id="eb-pass" type="number" min="1" max="100" value="70"
              style="width:100%;border:0.5px solid var(--border2);border-radius:var(--radius);padding:7px 10px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit;outline:none">
          </div>
        </div>
      </div>

      <div id="eb-questions">
        ${questions.map((q, qi) => qHTML(q, qi)).join('')}
      </div>

      <button onclick="ebAddQ()" style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);background:none;border:1.5px dashed var(--accent);border-radius:var(--radius);padding:10px 16px;cursor:pointer;font-family:inherit;width:100%;justify-content:center;margin-bottom:16px;opacity:0.85">
        <i class="ti ti-plus" aria-hidden="true"></i> Add question
      </button>

      <div style="display:flex;gap:8px">
        <button class="inline-btn" onclick="ebSave()" style="flex:1;padding:10px">Save exam</button>
        <button class="topbar-btn" onclick="renderNav('exams');renderPanel('exams')">Cancel</button>
      </div>
    </div>`;

    // Expose state to event handlers
    window.ebQuestions = questions;
    window.ebToggleCorrect = (qi, ci, checked) => {
      if (!Array.isArray(questions[qi].correct)) {
        questions[qi].correct = questions[qi].correct != null ? [questions[qi].correct] : [];
      }
      if (checked) {
        if (!questions[qi].correct.includes(ci)) questions[qi].correct.push(ci);
      } else {
        questions[qi].correct = questions[qi].correct.filter(x => x !== ci);
      }
      ebRerender();
    };
    window.ebAddQ = () => {
      questions.push({ text: '', choices: ['', '', '', ''], correct: [] });
      ebRerender();
    };
    window.ebRemoveQ = (qi) => {
      questions.splice(qi, 1);
      ebRerender();
    };
    window.ebAddChoice = (qi) => {
      questions[qi].choices.push('');
      ebRerender();
    };
    window.ebRemoveChoice = (qi, ci) => {
      questions[qi].choices.splice(ci, 1);
      // Update correct indices — remove ci, shift down indices > ci
      if (!Array.isArray(questions[qi].correct)) {
        questions[qi].correct = questions[qi].correct != null ? [questions[qi].correct] : [];
      }
      questions[qi].correct = questions[qi].correct
        .filter(x => x !== ci)
        .map(x => x > ci ? x - 1 : x);
      if (questions[qi].correct.length === 0) questions[qi].correct = [];
      ebRerender();
    };
    window.ebSave = () => {
      const name = document.getElementById('eb-name').value.trim();
      const dept = document.getElementById('eb-dept').value;
      const pass = parseInt(document.getElementById('eb-pass').value) || 70;
      if (!name) { document.getElementById('eb-name').focus(); toast('Please enter an exam name'); return; }
      const incomplete = questions.findIndex(q => !q.text.trim() || q.choices.filter(c=>c.trim()).length < 2 || (Array.isArray(q.correct)?q.correct.length===0:q.correct==null));
      if (incomplete !== -1) { toast(`Question ${incomplete+1} needs text, at least 2 choices, and at least 1 correct answer ticked`); return; }
      logAudit('Exams', 'Created exam', `"${name}" · ${dept} · ${questions.length} question${questions.length!==1?'s':''} · pass mark ${pass}%`);
      EXAM_LIBRARY.push({ name, dept, pass, questions: questions.map(q => ({...q, choices:[...q.choices], correct: Array.isArray(q.correct)?[...q.correct]:[q.correct]})) });
      saveData(true);
      toast(`Exam "${name}" saved — ${questions.length} question${questions.length!==1?'s':''}`);
      renderNav('exams');
      renderPanel('exams');
    };
    window.ebRerender = () => {
      // Snapshot current input values before re-rendering
      questions.forEach((q, qi) => {
        const textEl = document.querySelector(`#qcard-${qi} input[type=text]`);
        if (textEl) q.text = textEl.value;
        q.choices.forEach((_, ci) => {
          const choiceInputs = document.querySelectorAll(`#qcard-${qi} input[type=text]`);
          if (choiceInputs[ci+1]) q.choices[ci] = choiceInputs[ci+1].value;
        });
      });
      document.getElementById('eb-questions').innerHTML = questions.map((q, qi) => qHTML(q, qi)).join('');
    };
  }

  render();
}

function deleteExam(i) {
  const ex = EXAM_LIBRARY[i];
  if (!ex) return;
  if (!confirm(`Delete exam "${ex.name}"? All submissions for this exam will also be removed. This cannot be undone.`)) return;
  logAudit('Exams', 'Deleted exam', `"${ex.name}" · ${EXAM_SUBMISSIONS.filter(x => x.examIdx === i).length} submission(s) removed`);
  // Remove all submissions linked to this exam index,
  // then shift down any submissions for higher indices
  for (let j = EXAM_SUBMISSIONS.length - 1; j >= 0; j--) {
    if (EXAM_SUBMISSIONS[j].examIdx === i) {
      EXAM_SUBMISSIONS.splice(j, 1);
    } else if (EXAM_SUBMISSIONS[j].examIdx > i) {
      EXAM_SUBMISSIONS[j].examIdx--;
    }
  }
  EXAM_LIBRARY.splice(i, 1);
  saveData(true);
  renderPanel('exams');
  toast(`Exam "${ex.name}" deleted`);
}

function filteredAudit() {
  const F = window._auditF || {};
  const q = (F.q || '').toLowerCase().trim();
  const from = F.from ? new Date(F.from + 'T00:00:00').getTime() : null;
  const to   = F.to   ? new Date(F.to + 'T23:59:59').getTime() : null;
  return AUDIT_LOG.filter(a => {
    if (F.cat && a.category !== F.cat) return false;
    if (F.user && a.actor !== F.user) return false;
    const t = Date.parse(a.at);
    if (from && t < from) return false;
    if (to && t > to) return false;
    if (q && !(`${a.action} ${a.detail} ${a.actor} ${a.actorUsername} ${a.category}`.toLowerCase().includes(q))) return false;
    return true;
  }).sort((x, y) => (Date.parse(y.at) || 0) - (Date.parse(x.at) || 0));
}
function exportAuditCSV() {
  if (!['admin','hr'].includes(currentRole)) return;
  const rows = filteredAudit();
  const esc = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const csv = [['Date & time','Category','Action','Details','By','Username','Role'].map(esc).join(',')]
    .concat(rows.map(a => [a.time, a.category, a.action, a.detail, a.actor, a.actorUsername, a.actorRole && ROLES[a.actorRole] ? ROLES[a.actorRole].label : a.actorRole].map(esc).join(',')))
    .join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = 'OnboardIQ_Audit_Log_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  logAudit('Export', 'Exported audit log', rows.length + ' entr' + (rows.length===1?'y':'ies') + ' · CSV');
  toast('Audit log exported (' + rows.length + ' entries)');
}

function approveUser(email) {
  const idx = PENDING_USERS.findIndex(u => u.email === email);
  if (idx === -1) return;
  const u = PENDING_USERS.splice(idx, 1)[0];
  u.status = 'approved';
  u.approvedAt = new Date().toLocaleString();
  if (u.role === 'admin') u.role = 'employee';
  if (!USER_REGISTRY.some(x => x.username === u.username)) USER_REGISTRY.push(u);
  logAudit('Users', 'Approved access request', `${u.name} (@${u.username}) · ${u.email}`);
  toast(`${u.name} approved — they can now sign in`);
  saveData();
  if (currentPanel === 'settings') renderPanel('settings');
  updateBell();
}

function rejectUser(email) {
  const idx = PENDING_USERS.findIndex(u => u.email === email);
  if (idx === -1) return;
  PENDING_USERS[idx].status = 'rejected';
  logAudit('Users', 'Declined access request', `${PENDING_USERS[idx].name} (@${PENDING_USERS[idx].username}) · ${PENDING_USERS[idx].email}`);
  toast(`Access request for ${PENDING_USERS[idx].name} declined`);
  saveData();
  if (currentPanel === 'settings') renderPanel('settings');
  updateBell();
}

// Admin only: permanently removes a user account and everything recorded under it
// (video progress, exam submissions, assessment results, retake requests).
function removeUser(username) {
  if (currentRole !== 'admin') { toast('Only Admin can remove users'); return; }
  const user = USER_REGISTRY.find(u => u.username === username);
  if (!user) return;
  if (user.role === 'admin' && USER_REGISTRY.filter(x => x.role === 'admin').length <= 1) { toast('There must always be at least one Admin'); return; }
  if (currentUser && currentUser.username === username) { toast('You can\'t remove your own account'); return; }
  if (!confirm(`Remove ${user.name} (@${user.username})?\n\nThis permanently deletes their account and their video progress, exam results, personality test result and retake requests. They will no longer be able to sign in. This can't be undone.`)) return;
  const purge = (arr) => { for (let i = arr.length - 1; i >= 0; i--) if (arr[i] && arr[i].username === username) arr.splice(i, 1); };
  _restoring = true; // batch the deletions into a single save below
  try {
    purge(VIDEO_WATCH_PROGRESS); purge(EXAM_SUBMISSIONS); purge(ASSESSMENT_RESULTS); purge(RETAKE_REQUESTS); purge(PENDING_USERS);
    const idx = USER_REGISTRY.findIndex(u => u.username === username);
    if (idx > -1) USER_REGISTRY.splice(idx, 1);
  } finally { _restoring = false; }
  logAudit('Users', 'Removed user', `${user.name} (@${user.username}) · ${user.role} — account and records deleted`);
  saveData(true);
  toast(`${user.name} has been removed`);
  if (currentPanel === 'settings') renderPanel('settings');
  updateBell();
}

function startEditUser(username) {

function saveUserPassword(username) {
  const inp = document.getElementById(`upw-${username}`);
  if (!inp) return;
  const newPass = inp.value.trim();
  if (!newPass)        { inp.focus(); toast('Please enter a new password'); return; }

  setUserPassword(user, newPass);
  logAudit('Users', 'Reset password', `${user.name} (@${user.username})`);
  document.getElementById(`uedit-${username}`).style.display = 'none';
  toast(`Password updated for ${user.name}`);
  saveData();
}

function cancelEditUser(username) {

}

function addDept() {
  const inp = document.getElementById('new-dept-input');
  const name = inp.value.trim();
  if (!name) return;
  if (DEPARTMENTS.find(d => d.toLowerCase() === name.toLowerCase())) {
    toast('Department already exists'); return;
  }
  DEPARTMENTS.push(name);
  logAudit('Settings', 'Added department', name);
  saveData(true);
  inp.value = '';
  renderPanel('settings');
  toast(`Department "${name}" added`);
}

function deleteDept(i) {
  const name = DEPARTMENTS[i];
  const inUse = VIDEO_LIBRARY.find(v => v.dept === name) || EXAM_LIBRARY.find(e => e.dept === name);
  if (inUse) { toast(`Cannot delete — "${name}" has videos or exams assigned to it`); return; }
  if (!confirm(`Delete department "${name}"?`)) return;
  DEPARTMENTS.splice(i, 1);
  logAudit('Settings', 'Deleted department', name);
  saveData(true);
  renderPanel('settings');
  toast(`Department "${name}" deleted`);
}

function startEditDept(i) {
  const nameEl = document.getElementById(`dname-${i}`);
  const old = DEPARTMENTS[i];
  nameEl.innerHTML = `<input id="edit-dept-${i}" type="text" value="${old}"
    style="font-size:13px;padding:4px 8px;border:0.5px solid var(--accent);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:inherit;outline:none;width:180px"
    onkeydown="if(event.key==='Enter')saveDept(${i});if(event.key==='Escape')renderPanel('settings')">
    <button class="inline-btn" style="font-size:11px;padding:3px 8px;margin-left:6px" onclick="saveDept(${i})">Save</button>
    <button class="topbar-btn" style="font-size:11px;padding:3px 8px;margin-left:4px" onclick="renderPanel('settings')">Cancel</button>`;
  document.getElementById(`edit-dept-${i}`).focus();
}

function saveDept(i) {
  const inp = document.getElementById(`edit-dept-${i}`);
  if (!inp) return;
  const newName = inp.value.trim();
  if (!newName) return;
  const old = DEPARTMENTS[i];
  if (DEPARTMENTS.find((d,j) => j!==i && d.toLowerCase()===newName.toLowerCase())) {
    toast('A department with that name already exists'); return;
  }
  // Update all references
  DEPARTMENTS[i] = newName;
  VIDEO_LIBRARY.forEach(v => { if (v.dept === old) v.dept = newName; });
  EXAM_LIBRARY.forEach(e => { if (e.dept === old) e.dept = newName; });
  if (old !== newName) logAudit('Settings', 'Renamed department', `"${old}" → "${newName}"`);
  saveData(true);
  renderPanel('settings');
  toast(`Renamed to "${newName}"`);
}

/* ── Notifications: who sees what, and per-user read state ── */
function notifVisible(n) {
  if (!currentUser) return false;
  if (n.type === 'registration') return currentRole === 'admin';
  if (n.type === 'retake')       return ['admin','hr'].includes(currentRole);
  if (n.type === 'exam')         return ['admin','hr','manager'].includes(currentRole); // scores are private to staff
  if (n.type === 'retake_approved' || n.type === 'retake_rejected') return n.username === currentUser.username;
  return ['admin','hr'].includes(currentRole);
}
// Read state is tracked per user — one person opening the bell no longer marks it read for everyone.
function notifUnread(n) {
  if (!currentUser) return false;
  if (Array.isArray(n.readBy)) return !n.readBy.includes(currentUser.username);
  return !n.read; // older notifications saved before per-user tracking
}
function markNotifsRead(list) {
  if (!currentUser) return;
  let changed = false;
  list.forEach(n => {
    if (!notifUnread(n)) return;
    n.readBy = Array.isArray(n.readBy) ? n.readBy : [];
    n.readBy.push(currentUser.username);
    changed = true;
  });
  if (changed) saveData();
}

/* ── Bell badge ── */
function updateBell() {
  const badge = document.getElementById('bell-badge');
  if (!badge) return;
  const unread = NOTIFICATIONS.filter(n => notifVisible(n) && notifUnread(n)).length;
  badge.textContent = unread > 9 ? '9+' : String(unread);
  badge.style.display = unread > 0 ? 'block' : 'none';
  const btn = document.getElementById('bell-btn');
  if (btn) btn.setAttribute('aria-label', unread ? `Notifications (${unread} unread)` : 'Notifications');
  // keep the Exams sidebar badge in step too
  if (typeof currentPanel !== 'undefined' && currentUser && document.getElementById('sidebar-nav')) {
    const active = document.querySelector('#sidebar-nav .nav-item.active');
    if (currentRole === 'employee' && active) renderNav(currentPanel);
  }
}

/* ── Toast ── */
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
