/* ── Persistence: IndexedDB for files + localStorage for metadata ── */
const LS_KEY  = 'onboardiq_data';
const DB_NAME = 'onboardiq_files';
const DB_VER  = 1;
let _db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (_db) return resolve(_db);
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('files')) db.createObjectStore('files');
    };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror   = e => reject(e.target.error);
  });
}

function dbSet(key, value) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').put(value, key);
    tx.oncomplete = resolve;
    tx.onerror    = e => reject(e.target.error);
  }));
}

function dbGet(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx  = db.transaction('files', 'readonly');
    const req = tx.objectStore('files').get(key);
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  }));
}

function dbDelete(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').delete(key);
    tx.oncomplete = resolve;
    tx.onerror    = e => reject(e.target.error);
  }));
}

function dbGetAllKeys() {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx  = db.transaction('files', 'readonly');
    const req = tx.objectStore('files').getAllKeys();
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  }));
}

/* Read a File object as base64 data URL */
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload  = e => resolve(e.target.result);
    r.onerror = e => reject(e);
    r.readAsDataURL(file);
  });
}

/* ── File store ──────────────────────────────────────────────────────────────
   Every uploaded file (training video, pre-board video, form, personality-test screenshot)
   gets a stable fileId. The bytes live in this browser's IndexedDB under 'file_<id>' and —
   once cloud sync is set up — in Firebase (see CLOUD SYNC below). FILE_INDEX is the shared
   catalogue of files: {id, mime, size, name, cloud: uploaded?, url: Storage download URL}.
   It syncs with the rest of the data, so every device knows which files exist and where. */
const FILE_INDEX = {};
const LOCAL_FILES = {};           // in-memory cache: fileId -> data URL
function newFileId() { return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function registerLocalFile(id, dataUrl, mime, name) {
  LOCAL_FILES[id] = dataUrl;
  _savedFileSig['file_' + id] = _fileSig(dataUrl);
  dbSet('file_' + id, dataUrl).catch(() => {});
  FILE_INDEX[id] = { id, mime: mime || '', size: Math.round(dataUrl.length * 0.75), name: name || '', cloud: false, at: Date.now() };
  saveData();
  if (typeof cloudQueueUploads === 'function') cloudQueueUploads();
}
function forgetFile(id) {
  if (!id) return;
  delete LOCAL_FILES[id];
  dbDelete('file_' + id).catch(() => {});
  const had = FILE_INDEX[id];
  delete FILE_INDEX[id];
  if (had && typeof cloudDeleteFile === 'function') cloudDeleteFile(id, had);
  saveData();
}
function fileIsRemote(obj) {
  return !!(obj && obj.fileId && FILE_INDEX[obj.fileId] && (FILE_INDEX[obj.fileId].url || FILE_INDEX[obj.fileId].cloud));
}
// Data URL for a file: memory → this browser's IndexedDB → the cloud.
async function getFileData(id) {
  if (!id) return null;
  if (LOCAL_FILES[id]) return LOCAL_FILES[id];
  try { const d = await dbGet('file_' + id); if (d) { LOCAL_FILES[id] = d; return d; } } catch(e) {}
  const meta = FILE_INDEX[id];
  if (meta && meta.cloud && typeof cloudDownloadFile === 'function') {
    const d = await cloudDownloadFile(id, meta);
    if (d) { LOCAL_FILES[id] = d; _savedFileSig['file_' + id] = _fileSig(d); dbSet('file_' + id, d).catch(() => {}); return d; }
  }
  return null;
}
// Shrinks an uploaded screenshot (max 1600px, JPEG) so it stays light to store and sync.
function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, (maxDim || 1600) / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality || 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Not an image')); };
    img.src = url;
  });
}

/* ── saveData: persist metadata to localStorage, file blobs to IndexedDB, then the cloud ── */
let _saveDebounce = null;
const _savedFileSig = {};
let _applyingRemote = false;
function saveData(immediate) {
  if (!immediate) {
    clearTimeout(_saveDebounce);
    _saveDebounce = setTimeout(() => saveData(true), 80);
    return;
  }
  try {
    const snapshot = buildSnapshot();
    localStorage.setItem(LS_KEY, JSON.stringify(snapshot));
    // Broadcast to other tabs/windows so they sync immediately
    if (window._syncChannel && !_applyingRemote) {
      try { window._syncChannel.postMessage({ type: 'sync', ts: Date.now() }); } catch(e) {}
    }
  } catch(e) { console.warn('localStorage save failed', e); }

  // Save file data to IndexedDB — only files that changed since the last save. Rewriting every
  // video on every save (e.g. each progress tick) was what made playback stutter.
  const putIfChanged = (key, data) => {
    const sig = _fileSig(data);
    if (_savedFileSig[key] === sig) return;
    _savedFileSig[key] = sig;
    dbSet(key, data).catch(() => { delete _savedFileSig[key]; });
  };
  VIDEO_LIBRARY.forEach((v, i) => { if (v.fileData) putIfChanged(v.fileId ? 'file_' + v.fileId : 'video_' + i, v.fileData); });
  FORM_LIBRARY.forEach((f) => { if (f.fileData && (f.fileId || f.id)) putIfChanged(f.fileId ? 'file_' + f.fileId : 'form_' + f.id, f.fileData); });
  if (WELCOME_VIDEO && WELCOME_VIDEO.fileData) putIfChanged(WELCOME_VIDEO.fileId ? 'file_' + WELCOME_VIDEO.fileId : 'welcome_video', WELCOME_VIDEO.fileData);

  if (!_applyingRemote && typeof cloudSchedulePush === 'function') cloudSchedulePush();
}

function buildSnapshot() {
  return {
    userRegistry:      USER_REGISTRY,
    pendingUsers:      PENDING_USERS,
    notifications:     NOTIFICATIONS,
    assessmentResults: ASSESSMENT_RESULTS,
    retakeRequests:    RETAKE_REQUESTS,
    videoWatchProgress: VIDEO_WATCH_PROGRESS,
    examSubmissions:   EXAM_SUBMISSIONS,
    examLibrary:       EXAM_LIBRARY,
    departments:       DEPARTMENTS,
    auditLog:          AUDIT_LOG,
    fileIndex:         Object.values(FILE_INDEX),
    videoLibraryMeta:  VIDEO_LIBRARY.map((v, i) => ({
      dept: v.dept, title: v.title, tag: v.tag, tagClass: v.tagClass,
      dur: v.dur, mimeType: v.mimeType, dbKey: 'video_' + i, fileId: v.fileId || null,
      fileSig: v.fileData ? _fileSig(v.fileData) : (v.fileSig || '')
    })),
    formLibraryMeta: FORM_LIBRARY.map((f) => ({
      title: f.title, category: f.category, dept: f.dept,
      version: f.version, filename: f.filename,
      uploadedBy: f.uploadedBy, date: f.date,
      id: f.id, fileId: f.fileId || null,
      dbKey: f.fileData ? ('form_' + f.id) : null
    })),
    welcomeVideoMeta: WELCOME_VIDEO ? {
      title: WELCOME_VIDEO.title, uploadedBy: WELCOME_VIDEO.uploadedBy,
      date: WELCOME_VIDEO.date, mimeType: WELCOME_VIDEO.mimeType, fileId: WELCOME_VIDEO.fileId || null
    } : null
  };
}

/* ── loadData: restore everything including files from IndexedDB ── */
let _restoring = false; // pauses auto-save patch during restore
function loadData(silent) {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) {
      // First ever load — inject seed forms
      FORM_SEEDS.forEach(s => FORM_LIBRARY.push({...s, fileData: null}));
      saveData(true);
      return;
    }
    const d = JSON.parse(raw);
    applySnapshot(d, silent);
  } catch(e) { console.warn('loadData error', e); }
}

function replaceArray(arr, items) { arr.length = 0; (items || []).forEach(x => arr.push(x)); }

// Applies a saved snapshot (from this browser's storage, another tab, or the cloud) EXACTLY as
// given — what was deleted elsewhere is deleted here too. (It used to merge, which is why an
// approved registrant could still be seen as "pending" and couldn't sign in.)
function applySnapshot(d, silent) {
  _restoring = true;
  try {
    if (Array.isArray(d.userRegistry)) {
      replaceArray(USER_REGISTRY, d.userRegistry.slice());
      // keep the signed-in user object pointing at the fresh record
      if (currentUser) {
        const me = USER_REGISTRY.find(u => u.username === currentUser.username);
        if (me) currentUser = me;
      }
    }
    if (Array.isArray(d.pendingUsers)) replaceArray(PENDING_USERS, d.pendingUsers.filter(p => !USER_REGISTRY.some(u => u.username === p.username)));
    // Plain-text passwords from older saves are hashed straight away (and saved back, so the plain
    // text disappears from this browser and the cloud too).
    if (migratePasswords(USER_REGISTRY) | migratePasswords(PENDING_USERS) | enforceSingleAdmin()) setTimeout(() => saveData(), 0);
    setTimeout(() => { if (typeof refreshAuthScreen === 'function') refreshAuthScreen(); }, 0);
    if (Array.isArray(d.auditLog)) replaceArray(AUDIT_LOG, d.auditLog);
    if (Array.isArray(d.notifications)) replaceArray(NOTIFICATIONS, d.notifications.slice().sort((a, b) => (Number(a.id) || 0) - (Number(b.id) || 0)));
    if (Array.isArray(d.assessmentResults)) replaceArray(ASSESSMENT_RESULTS, d.assessmentResults);
    if (Array.isArray(d.retakeRequests)) replaceArray(RETAKE_REQUESTS, d.retakeRequests.slice().sort((a, b) => (Number(a.id) || 0) - (Number(b.id) || 0)));
    if (Array.isArray(d.videoWatchProgress)) replaceArray(VIDEO_WATCH_PROGRESS, d.videoWatchProgress);
    if (Array.isArray(d.examSubmissions)) {
      replaceArray(EXAM_SUBMISSIONS, d.examSubmissions);
      EXAM_SUBMISSIONS.forEach(x => { if (!x.sid) x.sid = 's_' + x.username + '_' + x.examIdx + '_' + String(x.submittedAt || '').replace(/\D/g, ''); });
    }
    if (Array.isArray(d.fileIndex)) {
      Object.keys(FILE_INDEX).forEach(k => delete FILE_INDEX[k]);
      d.fileIndex.forEach(fi => { if (fi && fi.id) FILE_INDEX[fi.id] = fi; });
    }
    if (d.examLibrary) replaceArray(EXAM_LIBRARY, d.examLibrary);
    // Departments — full replace from the saved list, so deleted or renamed departments
    // never come back (previously the default list was merged back in on every load).
    if (Array.isArray(d.departments)) {
      DEPARTMENTS.length = 0;
      d.departments.forEach(dep => { if (!DEPARTMENTS.includes(dep)) DEPARTMENTS.push(dep); });
    }
    // Forms — full replace from snapshot (deletions stick, seeds don't return)
    if (d.formLibraryMeta) {
      const existing = FORM_LIBRARY.slice();
      FORM_LIBRARY.length = 0;
      d.formLibraryMeta.forEach(f => {
        const prev = existing.find(x => (x.fileId && x.fileId === f.fileId) || (x.id && x.id === f.id && (!f.fileId || x.fileId === f.fileId)));
        FORM_LIBRARY.push({ ...f, fileData: prev ? prev.fileData : (f.fileId && LOCAL_FILES[f.fileId]) || null });
      });
    } else {
      // No forms in storage yet — inject seeds (first load from older storage format)
      if (FORM_LIBRARY.length === 0) {
        FORM_SEEDS.forEach(s => FORM_LIBRARY.push({...s, fileData: null}));
      }
    }
    // Videos — full replace from the saved list so edits (title/department/tag), replacements
    // and deletions show up correctly instead of leaving stale duplicates behind.
    if (Array.isArray(d.videoLibraryMeta)) {
      const old = VIDEO_LIBRARY.slice();
      const next = d.videoLibraryMeta.map((m, i) => {
        const ex = (m.fileId && old.find(x => x.fileId === m.fileId))
                || (!m.fileId && old.find(x => x.fileData && m.fileSig && _fileSig(x.fileData) === m.fileSig))
                || (!m.fileId && !m.fileSig && old[i] && old[i].title === m.title ? old[i] : null);
        if (ex) return Object.assign(ex, m);
        const local = m.fileId && LOCAL_FILES[m.fileId];
        return { ...m, fileUrl: local || null, fileData: local || null };
      });
      VIDEO_LIBRARY.length = 0;
      next.forEach(x => VIDEO_LIBRARY.push(x));
    }
    if (backfillAuditFromNotifications()) setTimeout(() => saveData(), 0);
    if ('welcomeVideoMeta' in d) {
      const m = d.welcomeVideoMeta;
      if (!m) WELCOME_VIDEO = null;
      else if (WELCOME_VIDEO && ((m.fileId && WELCOME_VIDEO.fileId === m.fileId) || (!m.fileId && !WELCOME_VIDEO.fileId))) Object.assign(WELCOME_VIDEO, m);
      else {
        const local = m.fileId && LOCAL_FILES[m.fileId];
        WELCOME_VIDEO = { ...m, fileUrl: local || null, fileData: local || null, needsReupload: !local };
      }
    }

    // Async: load file blobs from IndexedDB (new per-file keys first, then the older index-based keys)
    const loadInto = (obj, legacyKey) => {
      if (!obj || obj.fileData) return Promise.resolve();
      const tryKey = k => k ? dbGet(k).catch(() => null) : Promise.resolve(null);
      return tryKey(obj.fileId ? 'file_' + obj.fileId : null)
        .then(data => data || tryKey(legacyKey))
        .then(data => {
          if (!data) return;
          obj.fileData = data; obj.fileUrl = data; if ('needsReupload' in obj) obj.needsReupload = false;
          if (obj.fileId) { LOCAL_FILES[obj.fileId] = data; }
        });
    };
    openDB().then(() => {
      const vp = VIDEO_LIBRARY.map((v, i) => loadInto(v, 'video_' + i).then(() => { if (v.fileData) _savedFileSig[v.fileId ? 'file_' + v.fileId : 'video_' + i] = _fileSig(v.fileData); }));
      const fp = FORM_LIBRARY.map(f => loadInto(f, f.dbKey || (f.id ? 'form_' + f.id : null)));
      const wp = loadInto(WELCOME_VIDEO, 'welcome_video').then(() => { if (WELCOME_VIDEO && WELCOME_VIDEO.fileData) _savedFileSig[WELCOME_VIDEO.fileId ? 'file_' + WELCOME_VIDEO.fileId : 'welcome_video'] = _fileSig(WELCOME_VIDEO.fileData); });
      Promise.all([...vp, ...fp, wp]).then(() => {
        migrateFileIds();
        if (typeof cloudFetchMissingFiles === 'function') cloudFetchMissingFiles();
        if (!silent && typeof currentPanel !== 'undefined' && typeof renderPanel === 'function' && !videoBusy()) {
          renderPanel(currentPanel);
        }
        updateBell();
      });
    });
  } catch(e) { console.warn('applySnapshot error', e); }
  finally { _restoring = false; }
}

// Files saved before file IDs existed get one now, so they can be uploaded to the cloud.
function migrateFileIds() {
  let changed = false;
  const give = (obj) => {
    if (!obj || obj.fileId || !obj.fileData) return;
    obj.fileId = newFileId();
    LOCAL_FILES[obj.fileId] = obj.fileData;
    FILE_INDEX[obj.fileId] = { id: obj.fileId, mime: obj.mimeType || '', size: Math.round(obj.fileData.length * 0.75), name: obj.filename || obj.title || '', cloud: false, at: Date.now() };
    changed = true;
  };
  VIDEO_LIBRARY.forEach(give); FORM_LIBRARY.forEach(give); give(WELCOME_VIDEO);
  if (changed) { saveData(); if (typeof cloudQueueUploads === 'function') cloudQueueUploads(); }
}

/* ── Real-time sync: BroadcastChannel (same-origin tabs) + storage event ── */
function initSync() {
  // BroadcastChannel — instant cross-tab messaging
  if (typeof BroadcastChannel !== 'undefined') {
    window._syncChannel = new BroadcastChannel('onboardiq_sync');
    window._syncChannel.onmessage = (ev) => {
      if (ev.data && ev.data.type === 'sync') {
        loadData(true); // re-read localStorage
        if (typeof currentPanel !== 'undefined' && typeof renderPanel === 'function') {
          // Re-render current panel without disrupting user input
          if (!['exams','settings'].includes(currentPanel) && !videoBusy()) {
            renderPanel(currentPanel);
          }
        }
        updateBell();
      }
    };
  }
  // storage event — fires in OTHER tabs when localStorage changes
  window.addEventListener('storage', (e) => {
    if (e.key === LS_KEY) {
      try {
        const d = JSON.parse(e.newValue);
        applySnapshot(d, true);
        if (typeof currentPanel !== 'undefined' && typeof renderPanel === 'function') {
          if (!['exams','settings'].includes(currentPanel) && !videoBusy()) renderPanel(currentPanel);
        }
        updateBell();
      } catch(err) {}
    }
  });
  // Polling fallback every 10s (for same-tab or Safari BroadcastChannel gaps)
  setInterval(() => {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      applySnapshot(d, true);
      if (typeof currentPanel !== 'undefined' && typeof renderPanel === 'function') {
        if (!['exams','settings'].includes(currentPanel) && !videoBusy()) renderPanel(currentPanel);
      }
      updateBell();
    } catch(e) {}
  }, 10000);
}

const DB_MODE_MAX_FILE_MB = 150;
const CHUNK_CHARS = 1500000;                  // ~1.1 MB of file per database chunk

// Collections stored record-by-record, so two people saving at the same time never overwrite
// each other (e.g. two employees finishing an exam at once). Everything else is stored whole.
const CLOUD_KEYED = {
  userRegistry:       u => u.username,
  pendingUsers:       u => u.username,
  notifications:      n => String(n.id),
  assessmentResults:  r => r.username,

const CLOUD_WHOLE = ['examLibrary', 'departments', 'videoLibraryMeta', 'formLibraryMeta', 'welcomeVideoMeta'];

let _fbRoot = null, _fbData = null;
let _cloudPulled = false;          // nothing is pushed until the first pull has finished
let _cloudBase = null;             // what the cloud is known to hold (canonical strings), for diffing
let _localSeq = 0, _syncedSeq = 0, _pushTimer = null, _pushing = false, _remoteWaiting = false;

function firebaseReady() {
  if (_fbRoot) return true;
  try {
    if (!window.firebase || !FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.databaseURL) return false;
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    _fbRoot = firebase.database().ref(FIREBASE_SYNC_PATH);
    _fbData = _fbRoot.child('data');
    ensureFirebaseAuth();
    return true;
  } catch (err) { console.warn('Firebase init failed:', err); return false; }
}
// Silent anonymous sign-in so the browser is allowed to talk to Firebase (database rules
// "auth != null"). This does NOT replace the platform's own username/password login.
let _authPromise = null;
function ensureFirebaseAuth() {
  if (_authPromise) return _authPromise;
  _authPromise = new Promise(resolve => {
    if (!window.firebase || !firebase.auth) { resolve(false); return; }
    const unsub = firebase.auth().onAuthStateChanged(user => { if (user) { unsub(); resolve(true); } });
    firebase.auth().signInAnonymously().catch(err => { console.warn('Firebase anonymous sign-in failed:', err); resolve(false); });
  });
  return _authPromise;
}

function updateSyncBadge(status, extra) {
  const el = document.getElementById('syncBadge');
  if (!el) return;
  const map = {
    unconfigured: { text: '☁ Sync not set up', cls: 'gray', title: 'Cloud sync is not configured — data stays in this browser only.' },
    syncing:      { text: '⏳ Syncing…',        cls: 'amber', title: 'Saving to the cloud…' },
    synced:       { text: '☁ Synced',           cls: 'green', title: 'All changes are saved to the cloud' + (extra ? ' · ' + extra : '') },
    uploading:    { text: '⬆ ' + (extra || 'Uploading…'), cls: 'amber', title: 'Uploading a file to the cloud' },
    offline:      { text: '⚠ Offline',          cls: 'red',   title: 'Could not reach the cloud — changes are kept in this browser and will sync when back online.' }
  };
  const m = map[status] || map.unconfigured;
  el.textContent = m.text; el.title = m.title; el.dataset.state = m.cls;
  el.style.display = '';
}

/* ---- key escaping (Realtime Database keys can't contain . # $ / [ ]) ---- */
const FB_KEY_ESCAPES = { '.': '~dot~', '#': '~hash~', '$': '~dollar~', '/': '~slash~', '[': '~lb~', ']': '~rb~' };
const FB_KEY_UNESCAPES = { dot: '.', hash: '#', dollar: '$', slash: '/', lb: '[', rb: ']' };
const fbEsc = k => String(k).replace(/[.#$/[\]]/g, c => FB_KEY_ESCAPES[c]);
const fbUnesc = k => String(k).replace(/~(dot|hash|dollar|slash|lb|rb)~/g, (m, t) => FB_KEY_UNESCAPES[t]);
// Canonical form = what Firebase actually stores: no undefined/null/empty containers, keys escaped & sorted.
function fbCanon(x) {
  if (x === undefined || x === null) return undefined;
  if (typeof x === 'number' && !isFinite(x)) return undefined;
  if (Array.isArray(x)) {
    const arr = x.map(fbCanon);
    if (!arr.some(v => v !== undefined)) return undefined;
    // Firebase keeps arrays as arrays; holes come back as missing entries
    const o = {}; arr.forEach((v, i) => { if (v !== undefined) o[i] = v; });
    return Object.keys(o).length === arr.length ? arr : o;
  }
  if (typeof x === 'object') {
    const out = {};
    Object.keys(x).sort().forEach(k => { if (k.startsWith('_')) return; const v = fbCanon(x[k]); if (v !== undefined) out[fbEsc(k)] = v; });
    return Object.keys(out).length ? out : undefined;
  }
  return x;
}
function fbRestore(x) {
  if (Array.isArray(x)) return x.map(fbRestore);
  if (x && typeof x === 'object') { const o = {}; Object.keys(x).forEach(k => o[fbUnesc(k)] = fbRestore(x[k])); return o; }
  return x;
}
const canonStr = x => JSON.stringify(x === undefined ? null : x, (k, v) => (v && typeof v === 'object' && !Array.isArray(v)) ? Object.keys(v).sort().reduce((o, kk) => (o[kk] = v[kk], o), {}) : v);
const asList = x => !x ? [] : Array.isArray(x) ? x.filter(v => v != null) : Object.values(x);

// Local data → { c: {collection: {key: record}}, v: {name: value} } in canonical form
function localCloudShape() {
  const snap = buildSnapshot();
  const shape = { c: {}, v: {} };
  Object.keys(CLOUD_KEYED).forEach(coll => {
    const m = {};
    (snap[coll] || []).forEach(rec => { const k = CLOUD_KEYED[coll](rec); if (k == null || k === '') return; const c = fbCanon(rec); if (c !== undefined) m[fbEsc(k)] = c; });
    shape.c[coll] = m;
  });
  CLOUD_WHOLE.forEach(name => { shape.v[name] = fbCanon(snap[name]); });
  return shape;
}
function shapeStrings(shape) {
  const out = { c: {}, v: {} };
  Object.keys(CLOUD_KEYED).forEach(coll => { out.c[coll] = {}; Object.entries((shape.c || {})[coll] || {}).forEach(([k, v]) => out.c[coll][k] = canonStr(v)); });
  CLOUD_WHOLE.forEach(n => out.v[n] = canonStr((shape.v || {})[n]));
  return out;
}
// Cloud data → snapshot (same shape as buildSnapshot) for applySnapshot()
function cloudToSnapshot(data) {
  const c = (data && data.c) || {}, v = (data && data.v) || {};
  const snap = {};
  Object.keys(CLOUD_KEYED).forEach(coll => { snap[coll] = Object.values(c[coll] || {}).map(fbRestore); });
  snap.examLibrary = asList(fbRestore(v.examLibrary)).map(e => ({ ...e, questions: asList(e.questions).map(q => ({ ...q, choices: asList(q.choices), correct: asList(q.correct) })) }));
  snap.departments = asList(fbRestore(v.departments));
  snap.videoLibraryMeta = asList(fbRestore(v.videoLibraryMeta));
  snap.formLibraryMeta = asList(fbRestore(v.formLibraryMeta));
  snap.welcomeVideoMeta = v.welcomeVideoMeta ? fbRestore(v.welcomeVideoMeta) : null;
  snap.examSubmissions.forEach(x => { if (x.answers) x.answers = asList(x.answers).map(a => (a && typeof a === 'object') ? asList(a) : a); });
  snap.notifications.forEach(n => { if (n.readBy) n.readBy = asList(n.readBy); });
  return snap;
}

function applyCloudData(data) {
  _applyingRemote = true;
  try {
    applySnapshot(cloudToSnapshot(data), true);
    _cloudBase = shapeStrings({ c: (data && data.c) || {}, v: (data && data.v) || {} });
    saveData(true); // refresh this browser's offline copy (no push: nothing differs from the cloud)
  } finally { _applyingRemote = false; }
  cloudFetchMissingFiles();
  if (typeof currentPanel !== 'undefined' && currentUser && !['exams', 'settings'].includes(currentPanel) && !videoBusy() && !document.getElementById('modal-overlay').classList.contains('open')) renderPanel(currentPanel);
  if (currentUser) { renderNav(currentPanel); updateBell(); }
}

function cloudSchedulePush() {
  if (!firebaseReady()) return;
  _localSeq++;
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(cloudPush, 600);
}

async function cloudPush() {
  if (!firebaseReady() || !_cloudPulled) return;
  if (_pushing) { clearTimeout(_pushTimer); _pushTimer = setTimeout(cloudPush, 400); return; }
  _pushing = true;
  const seq = _localSeq;
  try {
    await ensureFirebaseAuth();
    const local = localCloudShape();
    const ls = shapeStrings(local);
    const base = _cloudBase || { c: {}, v: {} };
    const updates = {};
    Object.keys(CLOUD_KEYED).forEach(coll => {
      const now = ls.c[coll] || {}, was = (base.c || {})[coll] || {};
      Object.keys(now).forEach(k => { if (now[k] !== was[k]) updates[`c/${coll}/${k}`] = local.c[coll][k]; });
      Object.keys(was).forEach(k => { if (!(k in now)) updates[`c/${coll}/${k}`] = null; });
    });
    CLOUD_WHOLE.forEach(n => { if (ls.v[n] !== (base.v || {})[n]) updates[`v/${n}`] = local.v[n] === undefined ? null : local.v[n]; });
    if (Object.keys(updates).length) {
      updateSyncBadge('syncing');
      updates.updatedAt = Date.now();
      await _fbData.update(updates);
      _cloudBase = ls;
    }
    _syncedSeq = seq;
    updateSyncBadge('synced', new Date().toLocaleTimeString());
    if (_remoteWaiting && _localSeq === _syncedSeq) { _remoteWaiting = false; const snap = await _fbData.once('value'); applyCloudData(snap.val()); }
  } catch (err) {
    console.warn('Cloud sync (push) failed:', err);
    updateSyncBadge('offline');
    clearTimeout(_pushTimer); _pushTimer = setTimeout(cloudPush, 15000); // retry
  } finally { _pushing = false; }
}

async function cloudPull() {
  if (!firebaseReady()) { updateSyncBadge('unconfigured'); return false; }
  await ensureFirebaseAuth();
  updateSyncBadge('syncing');
  try {
    try { ADMIN_CLAIM = (await _fbRoot.child('adminClaim').once('value')).val(); } catch (e) {}
    const snap = await _fbData.once('value');
    const data = snap.val();
    if (data && (data.c || data.v)) applyCloudData(data);
    // Older installs: record the one existing Admin as the claimed Admin slot
    if (!ADMIN_CLAIM) {
      const admins = USER_REGISTRY.filter(u => u.role === 'admin');
      if (admins.length === 1) { ADMIN_CLAIM = { username: admins[0].username, at: Date.now() }; _fbRoot.child('adminClaim').set(ADMIN_CLAIM).catch(() => {}); }
    }
    else _cloudBase = { c: {}, v: {} };          // first-ever run: the push below seeds the cloud from this browser
    _cloudPulled = true;
    refreshAuthScreen();
    updateSyncBadge('synced', new Date().toLocaleTimeString());
    cloudPush();
    cloudQueueUploads();
    return true;
  } catch (err) {
    console.warn('Cloud sync (pull) failed — using this browser\'s copy:', err);
    updateSyncBadge('offline');
    return false;
  }
}
// Used by sign-in: fetch the latest accounts first (with a time limit) so a just-approved
// registrant can sign in from any device.
function cloudPullNow(timeoutMs) {
  if (!firebaseReady()) return Promise.resolve(false);
  return Promise.race([cloudPull(), new Promise(r => setTimeout(() => r(false), timeoutMs || 4000))]);
}

async function startRealtimeSync() {
  if (!firebaseReady()) return;
  await ensureFirebaseAuth();
  _fbData.on('value', snap => {
    if (!_cloudPulled) return;
    const data = snap.val();
    if (!data) return;
    if (_localSeq !== _syncedSeq || _pushing) { _remoteWaiting = true; return; } // a local edit is on its way up — apply after it lands
    // skip echoes of our own write
    const s = shapeStrings({ c: data.c || {}, v: data.v || {} });
    if (_cloudBase && canonStr(s) === canonStr(_cloudBase)) return;
    applyCloudData(data);
    updateSyncBadge('synced', new Date().toLocaleTimeString());
  });
}

function manualSync() {
  if (!firebaseReady()) {
    alert('Cloud sync isn\'t set up yet.\n\nAn administrator needs to paste the Firebase project settings into FIREBASE_CONFIG near the top of the CLOUD SYNC section of this file, then re-upload it.');
    return;
  }
  cloudPull();
}

/* ---- Files in the cloud ---- */
let _uploadBusy = false;
async function cloudQueueUploads() {
  if (!firebaseReady() || !_cloudPulled || _uploadBusy) return;
  const pending = Object.values(FILE_INDEX).filter(f => !f.cloud && LOCAL_FILES[f.id]);
  if (!pending.length) return;
  _uploadBusy = true;
  try {
    await ensureFirebaseAuth();
    for (const meta of pending) {
      if (!FILE_INDEX[meta.id]) continue; // deleted meanwhile
      const data = LOCAL_FILES[meta.id];
      const mb = data.length * 0.75 / 1048576;
      const label = (meta.name || 'file').slice(0, 28);
      try {
        if (FILE_STORAGE_MODE === 'storage') {
          if (!firebase.storage) throw new Error('Firebase Storage SDK not loaded');
          const ref = firebase.storage().ref(FIREBASE_SYNC_PATH + '/' + meta.id);
          const blob = await (await fetch(data)).blob();
          const task = ref.put(blob, { contentType: meta.mime || blob.type });
          await new Promise((res, rej) => task.on('state_changed',
            s => updateSyncBadge('uploading', `${label} ${Math.round(s.bytesTransferred / Math.max(1, s.totalBytes) * 100)}%`), rej, res));
          const url = await ref.getDownloadURL();
          if (FILE_INDEX[meta.id]) { FILE_INDEX[meta.id].url = url; FILE_INDEX[meta.id].cloud = true; }
        } else {
          if (mb > DB_MODE_MAX_FILE_MB) {
            toast(`"${label}" is ${mb.toFixed(0)} MB — too large to sync in database mode (limit ${DB_MODE_MAX_FILE_MB} MB). Use a smaller file or switch to Storage mode.`);
            continue;
          }
          const n = Math.ceil(data.length / CHUNK_CHARS);
          for (let i = 0; i < n; i++) {
            await _fbRoot.child(`chunks/${meta.id}/${i}`).set(data.slice(i * CHUNK_CHARS, (i + 1) * CHUNK_CHARS));
            updateSyncBadge('uploading', `${label} ${Math.round((i + 1) / n * 100)}%`);
          }
          await _fbRoot.child(`files/${meta.id}`).set({ n, mime: meta.mime || '', size: meta.size || 0 });
          if (FILE_INDEX[meta.id]) FILE_INDEX[meta.id].cloud = true;
        }
        saveData();
      } catch (err) {
        console.warn('File upload failed:', meta.id, err);
        toast(`Couldn't upload "${label}" to the cloud yet — it will retry automatically.`);
        updateSyncBadge('offline');
        setTimeout(() => { _uploadBusy = false; cloudQueueUploads(); }, 30000);
        return;
      }
    }
    updateSyncBadge('synced', new Date().toLocaleTimeString());
  } finally { _uploadBusy = false; }
}

const _downloading = {};
async function cloudDownloadFile(id, meta) {
  if (!firebaseReady()) return null;
  if (_downloading[id]) return _downloading[id];
  _downloading[id] = (async () => {
    await ensureFirebaseAuth();
    try {
      if (meta.url) {
        const blob = await (await fetch(meta.url)).blob();
        return await new Promise(res => { const r = new FileReader(); r.onload = e => res(e.target.result); r.readAsDataURL(blob); });
      }
      const info = (await _fbRoot.child(`files/${id}`).once('value')).val();
      if (!info || !info.n) return null;
      const parts = [];
      for (let i = 0; i < info.n; i++) parts.push((await _fbRoot.child(`chunks/${id}/${i}`).once('value')).val() || '');
      return parts.join('');
    } catch (err) { console.warn('File download failed:', id, err); return null; }
    finally { setTimeout(() => delete _downloading[id], 0); }
  })();
  return _downloading[id];
}
// Videos and forms that exist in the cloud but not yet in this browser are fetched in the
// background (Storage-mode videos don't need this — they stream straight from their URL).
let _fetchingMissing = false;
async function cloudFetchMissingFiles() {
  if (!firebaseReady() || _fetchingMissing) return;
  _fetchingMissing = true;
  try {
    const items = [...VIDEO_LIBRARY, ...(WELCOME_VIDEO ? [WELCOME_VIDEO] : []), ...FORM_LIBRARY]
      .filter(o => o && o.fileId && !o.fileData && FILE_INDEX[o.fileId] && FILE_INDEX[o.fileId].cloud && !FILE_INDEX[o.fileId].url);
    for (const o of items) {
      const d = await getFileData(o.fileId);
      if (!d) continue;
      o.fileData = d; o.fileUrl = d; if ('needsReupload' in o) o.needsReupload = false;
      if (currentUser && ['videos', 'journey', 'forms'].includes(currentPanel) && !videoBusy() && !document.getElementById('modal-overlay').classList.contains('open')) renderPanel(currentPanel);
    }
  } finally { _fetchingMissing = false; }
}
async function cloudDeleteFile(id, meta) {
  if (!firebaseReady() || !_cloudPulled) return;
  try {
    await ensureFirebaseAuth();
    if (meta && meta.url && firebase.storage) await firebase.storage().ref(FIREBASE_SYNC_PATH + '/' + id).delete().catch(() => {});
    await _fbRoot.child(`chunks/${id}`).remove();
    await _fbRoot.child(`files/${id}`).remove();
  } catch (err) { console.warn('Cloud file delete failed:', id, err); }
}

async function cloudInit() {
  if (!firebaseReady()) { updateSyncBadge('unconfigured'); return; }
  await cloudPull();
  startRealtimeSync();
  window.addEventListener('online', () => { cloudPush(); cloudQueueUploads(); });
}

/* ── Session persistence: auto-restore login after page reload ── */
const SESSION_KEY = 'onboardiq_session';
function saveSession() {
  if (!currentUser) return;
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ username: currentUser.username })); } catch(e) {}
}
function restoreSession() {
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (!raw) return false;
    const { username } = JSON.parse(raw);
    const user = USER_REGISTRY.find(u => u.username === username && (u.status === 'approved' || !u.status));
    if (!user || user.mustChangePassword) return false;
    currentUser = user;
    currentRole = user.role;
    document.getElementById('user-avatar').textContent = user.initials;
    document.getElementById('sidebar-user-label').textContent = user.name + ' · ' + ROLES[user.role].label;
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('main-app').style.display = 'flex';
    const first = ROLES[currentRole].nav[0];
    renderNav(first);
    renderPanel(first);
    updateBell();
    return true;
  } catch(e) { return false; }
}

// Auto-save whenever key arrays change — patch mutating points
(function() {
  var origPush   = Array.prototype.push;
  var origSplice = Array.prototype.splice;
  [USER_REGISTRY, PENDING_USERS, NOTIFICATIONS, ASSESSMENT_RESULTS,
   VIDEO_WATCH_PROGRESS, EXAM_SUBMISSIONS, RETAKE_REQUESTS,
   EXAM_LIBRARY, FORM_LIBRARY].forEach(function(arr) {
    arr.push = function() {
      var r = origPush.apply(this, arguments);
      if (!_restoring) saveData();
      return r;
    };
    arr.splice = function() {
      var r = origSplice.apply(this, arguments);
      if (!_restoring) saveData();
      return r;
    };
  });
})();

      type:        type,

      status:      'pending'

    if (existing !== -1) ASSESSMENT_RESULTS.splice(existing, 1);

      username:    username,
      type:        type,
      result:      desc,
      screenshotId: shotId,
      submittedAt: new Date().toLocaleString()
    });

    closeModal();

function approveRetake(retakeId) {
  var req = RETAKE_REQUESTS.find(function(r){ return r.id === retakeId; });

  var existing = ASSESSMENT_RESULTS.findIndex(function(r){ return r.username === req.username; });

    username:    req.username,
    type:        req.type,
    result:      req.result,
    submittedAt: req.requestedAt,
    screenshotId: req.screenshotId || null,
    retake:      true

function rejectRetake(retakeId) {

/* ── Passwords ──
   No passwords are written into this file. Each account's password is stored only as a salted
   SHA-256 hash (passSalt + passHash) — never as plain text — in this browser and in the cloud. */
function sha256Hex(ascii) {
  // compact SHA-256 (UTF-8 safe), synchronous so it works everywhere incl. file:// pages
  const utf8 = unescape(encodeURIComponent(ascii));
  const K = [], H = [], isPrime = n => { for (let f = 2; f * f <= n; f++) if (n % f === 0) return false; return true; };
  for (let n = 2, c = 0; c < 64; n++) if (isPrime(n)) { if (c < 8) H[c] = (Math.pow(n, 1 / 2) * 4294967296) | 0; K[c++] = (Math.pow(n, 1 / 3) * 4294967296) | 0; }
  const words = [], bitLen = utf8.length * 8;
  let s = utf8 + '\x80'; while (s.length % 64 - 56) s += '\x00';
  for (let i = 0; i < s.length; i++) words[i >> 2] |= s.charCodeAt(i) << ((3 - i) % 4) * 8;
  words[words.length] = (bitLen / 4294967296) | 0; words[words.length] = bitLen;
  const rr = (v, n) => (v >>> n) | (v << (32 - n));
  let hash = H.slice(0, 8);
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16), old = hash.slice(0);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + K[i] +
        (w[i] = i < 16 ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0; hash.length = 8;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
  }
  return hash.map(x => ('00000000' + (x >>> 0).toString(16)).slice(-8)).join('');
}
function makePasswordFields(pass) {
  const salt = Array.from({ length: 4 }, () => Math.random().toString(36).slice(2, 10)).join('');
  return { passSalt: salt, passHash: sha256Hex(salt + '|' + pass) };
}
function setUserPassword(user, pass) {
  Object.assign(user, makePasswordFields(pass));
  delete user.password;
}
function checkPassword(user, pass) {
  if (!user) return false;
  if (user.passHash) return sha256Hex((user.passSalt || '') + '|' + pass) === user.passHash;
  return false;
}
// Older saved data kept passwords as plain text, and the original demo accounts used published
// passwords. Plain text is converted to a hash right away; demo passwords must be changed at next sign-in.
// SHA-256 fingerprints of the two retired demo passwords (the passwords themselves are not in this file)
const RETIRED_DEFAULT_HASHES = ['240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9', '070a3b5e8d4bd5c46acccb91c9c54614c0cd649e78c4c4719e3a64270bae5ddf'];
const isRetiredPassword = p => RETIRED_DEFAULT_HASHES.includes(sha256Hex(p));
function migratePasswords(list) {
  let changed = false;
  (list || []).forEach(u => {
    if (u && typeof u.password === 'string') {
      if (isRetiredPassword(u.password)) u.mustChangePassword = true;
      setUserPassword(u, u.password);
      changed = true;
    }
  });
  return changed;
}
function hasAdminAccount() { return USER_REGISTRY.some(u => u.role === 'admin' && u.status !== 'rejected'); }
// Only ONE Admin account may exist. If older data (or two devices setting up at the same moment)
// ever produced more than one, the first-created Admin is kept and any others become HR Manager.
let ADMIN_CLAIM = null; // {username} — the cloud's record of who the Admin is (see createFirstAdmin)
function enforceSingleAdmin() {
  const admins = USER_REGISTRY.filter(u => u.role === 'admin');
  if (admins.length <= 1) return false;
  const keep = (ADMIN_CLAIM && admins.find(a => a.username === ADMIN_CLAIM.username)) || admins[0];
  admins.forEach(a => {
    if (a === keep) return;
    a.role = 'hr';
    AUDIT_LOG.push({ id: 'a' + Date.now() + '_' + a.username, at: new Date().toISOString(), time: new Date().toLocaleString(),
      category: 'Users', action: 'Extra Admin changed to HR Manager', detail: `${a.name} (@${a.username}) — only one Admin is allowed; @${keep.username} remains Admin`,
      actor: 'System', actorUsername: '', actorRole: '' });
  });
  if (currentUser && currentUser.role !== 'admin' && currentRole === 'admin') { currentRole = currentUser.role; }
  return true;
}

/* ── Auth screen modes: sign in / register, first-time Admin set-up, forced password change ── */
function setAuthMode(mode) {
  const show = (id, on) => { const el = document.getElementById(id); if (el) el.style.display = on ? '' : 'none'; };
  const tabs = document.querySelector('.auth-tab');
  if (tabs) tabs.style.display = (mode === 'login' || mode === 'register') ? '' : 'none';
  show('login-form', mode === 'login'); show('register-form', mode === 'register');
  show('setup-form', mode === 'setup'); show('changepw-form', mode === 'changepw');
  const sub = document.getElementById('auth-sub');
  if (sub) sub.textContent = mode === 'setup' ? 'First-time set-up — create the Administrator account.'
    : mode === 'changepw' ? 'Please set a new password to continue.'
    : 'Your HR onboarding hub — sign in to get started.';
}
// Shows the one-time "create Admin" screen only when no Admin exists anywhere yet. With cloud sync
// set up it waits for the cloud first, so a second device never creates a duplicate Admin.
function refreshAuthScreen() {
  if (currentUser || document.getElementById('auth-screen').classList.contains('hidden')) return;
  const cloudKnown = !firebaseReady() || _cloudPulled;
  const mode = document.getElementById('setup-form').style.display !== 'none' ? 'setup' : null;
  if (!hasAdminAccount() && cloudKnown) setAuthMode('setup');
  else if (mode === 'setup') setAuthMode('login');
}
async function claimAdminSlot(username) {
  if (!firebaseReady()) return true;                       // local-only: the check above is enough
  try {
    await ensureFirebaseAuth();
    const ref = _fbRoot.child('adminClaim');
    if (ref.transaction) {
      const res = await ref.transaction(cur => (cur && cur.username) ? undefined : { username, at: Date.now() });
      const val = res && res.snapshot && res.snapshot.val();
      return !!(res && res.committed && val && val.username === username);
    }
    const cur = (await ref.once('value')).val();
    if (cur && cur.username) return cur.username === username;
    await ref.set({ username, at: Date.now() });
    return true;
  } catch (e) { console.warn('Admin claim failed', e); return false; }
}
async function createFirstAdmin() {
  const btn = document.querySelector('#setup-form .auth-btn-primary');
  if (firebaseReady() && !_cloudPulled) { await cloudPullNow(5000); }
  if (hasAdminAccount()) { setAuthMode('login'); return showErr('login-err', 'An Admin account already exists — only one Admin is allowed. Please sign in or register.'); }
  const g = id => document.getElementById(id).value.trim();
  const name = g('su-name'), email = g('su-email').toLowerCase(), username = g('su-username').toLowerCase().replace(/\s+/g, '');
  const pass = document.getElementById('su-password').value, pass2 = document.getElementById('su-password2').value;
  if (hasAdminAccount()) { setAuthMode('login'); return showErr('login-err', 'An Admin account already exists — please sign in.'); }
  if (!name) return showErr('setup-err', 'Please enter your full name.');
  if (!email.includes('@')) return showErr('setup-err', 'Please enter a valid email.');
  if (username.length < 3 || !/^[a-z0-9_]+$/.test(username)) return showErr('setup-err', 'Username: at least 3 characters — letters, numbers and underscores only.');
  if (pass.length < 8) return showErr('setup-err', 'Password must be at least 8 characters.');
  if (pass !== pass2) return showErr('setup-err', 'The two passwords don\'t match.');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }
  const claimed = await claimAdminSlot(username);
  if (btn) { btn.disabled = false; btn.textContent = 'Create Admin account'; }
  if (!claimed) {
    await cloudPullNow(5000);
    setAuthMode('login');
    return showErr('login-err', firebaseReady() && !_cloudPulled ? 'Could not reach the cloud to create the Admin account — check your connection and try again.' : 'An Admin account was just created on another device — only one Admin is allowed. Please sign in or register.');
  }
  const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
  const user = { name, username, email, dept: 'Administration', role: 'admin', initials, status: 'approved', createdAt: new Date().toLocaleString() };
  setUserPassword(user, pass);
  USER_REGISTRY.push(user);
  logAudit('Users', 'Created Administrator account (first-time set-up)', `${name} (@${username})`, { name, username, role: 'admin' });
  saveData(true);
  ['su-name', 'su-email', 'su-username', 'su-password', 'su-password2'].forEach(id => document.getElementById(id).value = '');
  enterApp(user);
  toast('Administrator account created');
}
let _pwChangeUser = null;
function saveForcedPasswordChange() {
  const p1 = document.getElementById('cp-password').value, p2 = document.getElementById('cp-password2').value;
  if (!_pwChangeUser) { setAuthMode('login'); return; }
  if (p1.length < 8) return showErr('changepw-err', 'Password must be at least 8 characters.');
  if (isRetiredPassword(p1)) return showErr('changepw-err', 'Please choose a different password.');
  if (p1 !== p2) return showErr('changepw-err', 'The two passwords don\'t match.');
  setUserPassword(_pwChangeUser, p1);
  delete _pwChangeUser.mustChangePassword;
  logAudit('Account', 'Changed password', `${_pwChangeUser.name} (@${_pwChangeUser.username})`, { name: _pwChangeUser.name, username: _pwChangeUser.username, role: _pwChangeUser.role });
  saveData(true);
  const u = _pwChangeUser; _pwChangeUser = null;
  document.getElementById('cp-password').value = ''; document.getElementById('cp-password2').value = '';
  enterApp(u);
  toast('Password updated');
}
function enterApp(user) {
  currentUser = user;
  currentRole = user.role;
  logAudit('Account', 'Signed in', `${user.name} (@${user.username}) · ${ROLES[user.role].label}`);
  document.getElementById('user-avatar').textContent = user.initials;
  document.getElementById('sidebar-user-label').textContent = user.name + ' · ' + ROLES[user.role].label;
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('main-app').style.display = 'flex';
  setAuthMode('login');
  saveSession(); // persist login for reload
  const first = ROLES[currentRole].nav[0];
  renderNav(first);
  renderPanel(first);
  updateBell();
}
// Admin: change someone's access level (Employee / Manager / HR / Admin)
function changeUserRole(username, role) {
  if (currentRole !== 'admin') { toast('Only Admin can change access levels'); return; }
  const u = USER_REGISTRY.find(x => x.username === username);
  if (!u || !ROLES[role] || u.role === role) return;
  if (role === 'admin') { toast('Only one Admin account is allowed'); renderPanel('settings'); return; }
  if (u.role === 'admin') { toast('The Admin account can\'t be changed here'); renderPanel('settings'); return; }
  logAudit('Users', 'Changed access level', `${u.name} (@${u.username}) · ${ROLES[u.role].label} → ${ROLES[role].label}`);
  u.role = role;
  saveData(true);
  toast(`${u.name} is now ${ROLES[role].label}`);
  renderPanel('settings');
}

function doLogin() {
  const usernameInput = document.getElementById('login-username');
  const passInput     = document.getElementById('login-password');
  const errEl         = document.getElementById('login-err');
  const btn           = document.querySelector('#login-form .auth-btn-primary');
  const username = usernameInput.value.trim().toLowerCase();
  const pass     = passInput.value;
  errEl.classList.remove('show');

  if (!username) { usernameInput.focus(); return showErr('login-err', 'Please enter your username.'); }
  if (!pass)     { passInput.focus();     return showErr('login-err', 'Please enter your password.'); }

  // Loading state
  if (btn) { btn.textContent = 'Signing in…'; btn.disabled = true; }

  // Get the latest accounts first — from this browser's storage and, when cloud sync is set up,
  // from the cloud — so someone the Admin just approved (on another device) can sign in right away.
  try { loadData(true); } catch(e) {}
  Promise.all([cloudPullNow(4000), new Promise(r => setTimeout(r, 320))]).then(() => {
    if (btn) { btn.textContent = 'Sign in'; btn.disabled = false; }

    // An approved account always wins over an old "pending" entry for the same username.
    const approved = USER_REGISTRY.find(u => (u.username || '').toLowerCase() === username);
    const pendingUser = !approved ? PENDING_USERS.find(u => (u.username || '').toLowerCase() === username) : null;
    if (pendingUser) {
      if (pendingUser.status === 'rejected') return showErr('login-err', 'Your access request was declined. Contact your HR team.');
      return showErr('login-err', 'Your account is pending admin approval.');
    }

    const user = approved && checkPassword(approved, pass) ? approved : null;
    if (!user) {
      passInput.value = '';
      passInput.focus();
      logAudit('Account', 'Failed sign-in attempt', `Wrong password or unknown username "${username}"`, { name: 'Unknown (sign-in attempt)', username, role: '' });
      return showErr('login-err', 'Incorrect username or password. Please try again.');
    }
    if (user.status === 'pending')  return showErr('login-err', 'Your account is pending admin approval.');
    if (user.status === 'rejected') return showErr('login-err', 'Your access request was declined. Contact your HR team.');
    passInput.value = '';
    if (user.mustChangePassword) { _pwChangeUser = user; setAuthMode('changepw'); return; }
    enterApp(user);
  });
}

function doRegister() {
  const name     = document.getElementById('reg-name').value.trim();
  const email    = document.getElementById('reg-email').value.trim().toLowerCase();
  const username = document.getElementById('reg-username').value.trim().toLowerCase().replace(/\s+/g, '');
  const pass     = document.getElementById('reg-password').value;
  document.getElementById('reg-err').classList.remove('show');
  document.getElementById('reg-pending').classList.remove('show');

  if (!name)                  return showErr('reg-err', 'Please enter your full name.');
  if (!email.includes('@'))   return showErr('reg-err', 'Please enter a valid email.');
  if (!username)              return showErr('reg-err', 'Please choose a username.');
  if (username.length < 3)    return showErr('reg-err', 'Username must be at least 3 characters.');
  if (!/^[a-z0-9_]+$/.test(username)) return showErr('reg-err', 'Username can only contain letters, numbers, and underscores.');
  if (pass.length < 6)        return showErr('reg-err', 'Password must be at least 6 characters.');

  const allUsers = [...USER_REGISTRY, ...PENDING_USERS];
  if (allUsers.find(u => u.email === email))              return showErr('reg-err', 'An account with this email already exists.');
  if (allUsers.find(u => u.username === username))        return showErr('reg-err', 'That username is already taken. Please choose another.');

  const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
  PENDING_USERS.push({ name, username, email, ...makePasswordFields(pass), dept: 'Unassigned', role: 'employee', initials, status: 'pending', requestedAt: new Date().toLocaleString() });
  logAudit('Account', 'Registered (awaiting approval)', `${name} (@${username}) · ${email}`, { name, username, role: 'employee' });

  // Push notification for admin
  NOTIFICATIONS.push({
    id: Date.now(),
    type: 'registration',
    title: `New registration: ${name}`,
    sub: `@${username} · ${email} — awaiting approval`,
    time: new Date().toLocaleString(),
    read: false,
    email
  });

  const pending = document.getElementById('reg-pending');
  pending.innerHTML = `<strong>Registration submitted.</strong><br>Your username: <strong>${username}</strong><br>An Admin will review your request. You can sign in once approved.`;
  pending.classList.add('show');
  document.getElementById('reg-name').value     = '';
  document.getElementById('reg-email').value    = '';
  document.getElementById('reg-username').value = '';
  document.getElementById('reg-password').value = '';
}

function doLogout() {
  if (currentUser) logAudit('Account', 'Signed out', `${currentUser.name} (@${currentUser.username})`);
  currentUser = null;
  currentRole = 'admin';
  try { sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
  document.getElementById('main-app').style.display = 'none';
  document.getElementById('auth-screen').classList.remove('hidden');
  document.getElementById('login-username').value = '';
  document.getElementById('login-password').value = '';
  document.getElementById('login-err').classList.remove('show');
  showTab('login');
  refreshAuthScreen();
}

/* ══════════════════════════════════════════════════════
   EXCEL EXPORT ENGINE  (pure JS, no external library)
   Builds a real .xlsx file with multiple sheets
   ══════════════════════════════════════════════════════ */

function xlsxEscape(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildXlsxSheet(rows) {
  // rows = array of arrays (header first)
  let maxCol = 0;
  rows.forEach(r => { if (r.length > maxCol) maxCol = r.length; });

  const sharedStrings = [];
  const siMap = {};
  function si(val) {
    const s = String(val === null || val === undefined ? '' : val);
    if (siMap[s] === undefined) { siMap[s] = sharedStrings.length; sharedStrings.push(s); }
    return siMap[s];
  }

  // Build worksheet XML
  let sheetData = '<sheetData>';
  rows.forEach((row, ri) => {
    sheetData += `<row r="${ri+1}">`;
    row.forEach((cell, ci) => {
      const colLetter = colName(ci);
      const ref = `${colLetter}${ri+1}`;
      const isNum = typeof cell === 'number';
      if (isNum) {
        sheetData += `<c r="${ref}"><v>${cell}</v></c>`;
      } else {
        sheetData += `<c r="${ref}" t="s"><v>${si(cell)}</v></c>`;
      }
    });
    sheetData += '</row>';
  });
  sheetData += '</sheetData>';

  // Auto column widths (rough)
  let cols = '<cols>';
  for (let i = 0; i < maxCol; i++) {
    const maxLen = Math.min(50, Math.max(10, ...rows.map(r => String(r[i]||'').length)));
    cols += `<col min="${i+1}" max="${i+1}" width="${maxLen * 1.1}" bestFit="1" customWidth="1"/>`;
  }
  cols += '</cols>';

  const wsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
${cols}${sheetData}
</worksheet>`;

  return { wsXml, sharedStrings, siMap };
}

function colName(n) {
  let s = '';
  n++;
  while (n > 0) { s = String.fromCharCode(64 + (n % 26 || 26)) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

function buildXlsx(sheets) {
  // sheets = [{name, rows}]
  // Collect all shared strings across sheets
  const allStrings = [];
  const allMap = {};
  function gsi(val) {
    const s = String(val === null || val === undefined ? '' : val);
    if (allMap[s] === undefined) { allMap[s] = allStrings.length; allStrings.push(s); }
    return allMap[s];
  }

  const wsXmls = sheets.map(({ rows }) => {
    let maxCol = 0;
    rows.forEach(r => { if (r.length > maxCol) maxCol = r.length; });
    let sheetData = '<sheetData>';
    rows.forEach((row, ri) => {
      sheetData += `<row r="${ri+1}">`;
      row.forEach((cell, ci) => {
        const ref = `${colName(ci)}${ri+1}`;
        const isNum = typeof cell === 'number';
        if (isNum) {
          sheetData += `<c r="${ref}"><v>${cell}</v></c>`;
        } else {
          sheetData += `<c r="${ref}" t="s"><v>${gsi(cell)}</v></c>`;
        }
      });
      sheetData += '</row>';
    });
    sheetData += '</sheetData>';
    let cols = '<cols>';
    for (let i = 0; i < maxCol; i++) {
      const maxLen = Math.min(60, Math.max(12, ...rows.map(r => String(r[i]||'').length)));
      cols += `<col min="${i+1}" max="${i+1}" width="${Math.round(maxLen * 1.2)}" bestFit="1" customWidth="1"/>`;
    }
    cols += '</cols>';
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}${sheetData}</worksheet>`;
  });

  // Shared strings XML
  const ssXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="${allStrings.length}" uniqueCount="${allStrings.length}">
${allStrings.map(s => `<si><t xml:space="preserve">${xlsxEscape(s)}</t></si>`).join('')}
</sst>`;

  // Workbook XML
  const wbXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
          xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>
${sheets.map((s,i) => `<sheet name="${xlsxEscape(s.name)}" sheetId="${i+1}" r:id="rId${i+2}"/>`).join('')}
</sheets>
</workbook>`;

  // Workbook rels
  const wbRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/>
${sheets.map((_,i) => `<Relationship Id="rId${i+2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}
</Relationships>`;

  // Root rels
  const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`;

  // [Content_Types]
  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml"  ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/>
${sheets.map((_,i) => `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}
</Types>`;

  // Build ZIP using JSZip-compatible manual method (pure base64 approach via zip.js polyfill)
  // We'll use the fflate approach embedded inline
  const files = {
    '[Content_Types].xml': contentTypes,
    '_rels/.rels': rootRels,
    'xl/workbook.xml': wbXml,
    'xl/_rels/workbook.xml.rels': wbRels,
    'xl/sharedStrings.xml': ssXml,
  };
  sheets.forEach((_, i) => { files[`xl/worksheets/sheet${i+1}.xml`] = wsXmls[i]; });

  return zipFiles(files);
}

/* Minimal ZIP builder (no compression — store only) */
function zipFiles(files) {
  const parts = [];
  const central = [];
  let offset = 0;

  function strToBytes(s) {
    const bytes = [];
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      if (c < 128) { bytes.push(c); }
      else if (c < 2048) { bytes.push(192|(c>>6), 128|(c&63)); }
      else { bytes.push(224|(c>>12), 128|((c>>6)&63), 128|(c&63)); }
    }
    return new Uint8Array(bytes);
  }

  function u16(n) { return [n&0xff, (n>>8)&0xff]; }
  function u32(n) { return [n&0xff, (n>>8)&0xff, (n>>16)&0xff, (n>>24)&0xff]; }

  function crc32(data) {
    let c = 0xFFFFFFFF;
    const table = crc32.t || (crc32.t = (() => {
      const t = new Uint32Array(256);
      for (let i=0; i<256; i++) { let n=i; for(let j=0;j<8;j++) n = n&1 ? 0xEDB88320^(n>>>1) : n>>>1; t[i]=n; }
      return t;
    })());
    for (let i=0; i<data.length; i++) c = table[(c^data[i])&0xff] ^ (c>>>8);
    return (c^0xFFFFFFFF) >>> 0;
  }

  function concat(...arrs) {
    const total = arrs.reduce((s,a) => s + a.length, 0);
    const out = new Uint8Array(total);
    let pos = 0;
    arrs.forEach(a => { out.set(a, pos); pos += a.length; });
    return out;
  }

  for (const [name, content] of Object.entries(files)) {
    const nameBytes  = strToBytes(name);
    const dataBytes  = strToBytes(content);
    const crc        = crc32(dataBytes);
    const size       = dataBytes.length;

    const local = new Uint8Array([
      0x50,0x4B,0x03,0x04,       // local file header sig
      20,0,                       // version needed
      0,0,                        // flags
      0,0,                        // compression (store)
      0,0, 0,0,                   // mod time, mod date
      ...u32(crc),
      ...u32(size), ...u32(size), // compressed = uncompressed
      ...u16(nameBytes.length), ...u16(0),
    ]);
    const localEntry = concat(local, nameBytes, dataBytes);
    parts.push(localEntry);

    const cdir = new Uint8Array([
      0x50,0x4B,0x01,0x02,       // central dir sig
      20,0, 20,0,                 // version made, version needed
      0,0, 0,0,                   // flags, compression
      0,0, 0,0,                   // mod time, date
      ...u32(crc),
      ...u32(size), ...u32(size),
      ...u16(nameBytes.length), ...u16(0), ...u16(0),
      ...u16(0), ...u16(0),       // disk start, int attr
      ...u32(0),                  // ext attr
      ...u32(offset),
    ]);
    central.push(concat(cdir, nameBytes));
    offset += localEntry.length;
  }

  const centralBytes = concat(...central);
  const endRecord = new Uint8Array([
    0x50,0x4B,0x05,0x06,
    0,0, 0,0,
    ...u16(central.length), ...u16(central.length),
    ...u32(centralBytes.length),
    ...u32(offset),
    0,0,
  ]);

  return concat(...parts, centralBytes, endRecord);
}

function downloadXlsx(filename, sheets) {
  const bytes = buildXlsx(sheets);
  const blob  = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url   = URL.createObjectURL(blob);
  const a     = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ── Export: Assessment Results ── */
function exportAssessments() {
  if (!['admin','hr'].includes(currentRole)) return;
  logAudit('Export', 'Exported personality test results', 'Excel file');

  const employees = USER_REGISTRY.filter(u => u.role === 'employee');
  const now = new Date().toLocaleString();

  // Sheet 1 — Summary
  const summaryRows = [
    ['OnboardIQ — Personality Test Results Export'],
    ['Generated by:', currentUser ? currentUser.name : '—', 'Date:', now],
    [],
    ['Employee Name', 'Username', 'Department', 'Personality Type', 'Type Name', 'Role (16P)', 'Strategy', 'Tagline', 'Submitted At', 'Status'],
  ];
  employees.forEach(u => {
    const r  = ASSESSMENT_RESULTS.find(x => x.username === u.username);
    const fd = r && MBTI_FULL[r.type] ? MBTI_FULL[r.type] : null;
    const typeNames = {INTJ:'Architect',INTP:'Logician',ENTJ:'Commander',ENTP:'Debater',INFJ:'Advocate',INFP:'Mediator',ENFJ:'Protagonist',ENFP:'Campaigner',ISTJ:'Logistician',ISFJ:'Defender',ESTJ:'Executive',ESFJ:'Consul',ISTP:'Virtuoso',ISFP:'Adventurer',ESTP:'Entrepreneur',ESFP:'Entertainer'};
    summaryRows.push([
      u.name, u.username, u.dept || '—',
      r ? r.type : 'Not submitted',
      r ? (typeNames[r.type] || '—') : '—',
      fd ? fd.role : '—',
      fd ? fd.strategy : '—',
      fd ? fd.tagline : '—',
      r ? r.submittedAt : '—',
      r ? 'Completed' : 'Pending',
    ]);
  });

  // Sheet 2 — Detailed traits per employee
  const detailRows = [
    ['Employee Name', 'Username', 'Department', 'Type', 'Core Traits', 'Strengths', 'Growth Areas', 'Team Tip'],
  ];
  employees.forEach(u => {
    const r  = ASSESSMENT_RESULTS.find(x => x.username === u.username);
    const fd = r && MBTI_FULL[r.type] ? MBTI_FULL[r.type] : null;
    if (r && fd) {
      detailRows.push([
        u.name, u.username, u.dept || '—', r.type,
        fd.traits.join(', '),
        fd.strengths.join('; '),
        fd.weaknesses.join('; '),
        fd.teamTip,
      ]);
    } else {
      detailRows.push([u.name, u.username, u.dept || '—', 'No result yet', '', '', '', '']);
    }
  });

  // Sheet 3 — Type distribution
  const typeCounts = {};
  ASSESSMENT_RESULTS.forEach(r => { typeCounts[r.type] = (typeCounts[r.type] || 0) + 1; });
  const distRows = [
    ['Personality Type', 'Type Name', 'Role (16P)', 'Count', '% of Submissions'],
  ];
  Object.entries(typeCounts).sort((a,b) => b[1]-a[1]).forEach(([type, count]) => {
    const typeNames = {INTJ:'Architect',INTP:'Logician',ENTJ:'Commander',ENTP:'Debater',INFJ:'Advocate',INFP:'Mediator',ENFJ:'Protagonist',ENFP:'Campaigner',ISTJ:'Logistician',ISFJ:'Defender',ESTJ:'Executive',ESFJ:'Consul',ISTP:'Virtuoso',ISFP:'Adventurer',ESTP:'Entrepreneur',ESFP:'Entertainer'};
    const fd = MBTI_FULL[type] || {};
    distRows.push([type, typeNames[type]||'—', fd.role||'—', count, ASSESSMENT_RESULTS.length > 0 ? Math.round((count/ASSESSMENT_RESULTS.length)*100) + '%' : '0%']);
  });

  const dateStr = new Date().toISOString().slice(0,10);
  downloadXlsx(`OnboardIQ_Personality_Test_Results_${dateStr}.xlsx`, [
    { name: 'Summary',      rows: summaryRows },
    { name: 'Trait Details', rows: detailRows },
    { name: 'Type Distribution', rows: distRows },
  ]);
  toast('Personality test results exported to Excel ✓');
}

/* ── Export: Exam Results ── */
function exportExams() {
  if (!['admin','hr'].includes(currentRole)) return;
  logAudit('Export', 'Exported exam results', 'Excel file');

  const employees = USER_REGISTRY.filter(u => u.role === 'employee');
  const now = new Date().toLocaleString();

  // Sheet 1 — All employees × all exams
  const headerRow = ['Employee Name', 'Username', 'Department'];
  EXAM_LIBRARY.forEach(ex => {
    headerRow.push(`${ex.name} — Score`, `${ex.name} — Result`, `${ex.name} — Date`);
  });
  const overviewRows = [
    ['OnboardIQ — Exam Results Export'],
    ['Generated by:', currentUser ? currentUser.name : '—', 'Date:', now],
    [],
    headerRow,
  ];
  employees.forEach(u => {
    const row = [u.name, u.username, u.dept || '—'];
    EXAM_LIBRARY.forEach((_, i) => {
      const sub = EXAM_SUBMISSIONS.find(s => s.username === u.username && s.examIdx === i);
      if (sub) {
        row.push(sub.score, sub.passed ? 'Passed' : 'Failed', sub.submittedAt);
      } else {
        row.push('—', 'Not taken', '—');
      }
    });
    overviewRows.push(row);
  });

  // One sheet per exam with detailed breakdown
  const examSheets = EXAM_LIBRARY.map((ex, i) => {
    const subs   = EXAM_SUBMISSIONS.filter(s => s.examIdx === i);
    const passed = subs.filter(s => s.passed).length;
    const avgScore = subs.length > 0 ? Math.round(subs.reduce((a,s) => a+s.score, 0) / subs.length) : 0;
    const rows = [
      [`Exam: ${ex.name}`],
      ['Department:', ex.dept, 'Pass threshold:', ex.pass + '%', 'Questions:', ex.questions.length],
      ['Submissions:', subs.length, 'Passed:', passed, 'Failed:', subs.length - passed, 'Avg score:', avgScore + '%'],
      [],
      ['Employee Name', 'Username', 'Department', 'Score (%)', 'Result', 'Submitted At'],
    ];
    employees.forEach(u => {
      const sub = subs.find(s => s.username === u.username);
      if (sub) {
        rows.push([u.name, u.username, u.dept||'—', sub.score, sub.passed ? 'Passed' : 'Failed', sub.submittedAt]);
      } else {
        rows.push([u.name, u.username, u.dept||'—', '—', 'Not taken', '—']);
      }
    });
    // Question breakdown header
    rows.push([]);
    rows.push(['Question-level breakdown (employees who submitted)']);
    const qHeader = ['Employee'];
    ex.questions.forEach((q, qi) => qHeader.push(`Q${qi+1}: ${q.text.slice(0,40)}${q.text.length>40?'…':''}`));
    qHeader.push('Total Score');
    rows.push(qHeader);
    subs.forEach(sub => {
      const u = employees.find(e => e.username === sub.username) || { name: sub.username };
      const qRow = [u.name];
      ex.questions.forEach((q, qi) => {
        const correctArr = Array.isArray(q.correct) ? q.correct : [q.correct];
        const ans = sub.answers[qi];
        const selectedArr = Array.isArray(ans) ? ans : (ans === -1 ? [] : [ans]);
        const isCorrect = correctArr.length === selectedArr.length && correctArr.every(c => selectedArr.includes(c));
        const choiceLabels = selectedArr.map(ci => q.choices[ci] || `Choice ${ci+1}`).join(', ') || '—';
        qRow.push(isCorrect ? `✓ ${choiceLabels}` : `✗ ${choiceLabels}`);
      });
      qRow.push(sub.score + '%');
      rows.push(qRow);
    });
    return { name: ex.name.slice(0, 31), rows };
  });

  const dateStr = new Date().toISOString().slice(0,10);
  downloadXlsx(`OnboardIQ_Exam_Results_${dateStr}.xlsx`, [
    { name: 'Overview', rows: overviewRows },
    ...examSheets,
  ]);
  toast('Exam results exported to Excel ✓');
}

/* ── Combined export ── */
function exportAll() {
  if (!['admin','hr'].includes(currentRole)) return;
  exportAssessments();
  setTimeout(() => exportExams(), 600);
  toast('Exporting all results…');
}

/* ── Day / Night mode ── */
function isDarkTheme() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function syncThemeIcons() {
  const dark = isDarkTheme();
  document.querySelectorAll('.theme-ic').forEach(i => { i.className = 'ti ' + (dark ? 'ti-sun' : 'ti-moon') + ' theme-ic'; });
  document.querySelectorAll('.theme-toggle').forEach(b => b.title = dark ? 'Switch to day mode' : 'Switch to night mode');
}
function toggleTheme() {
  const next = isDarkTheme() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('onboardiq_theme', next); } catch (e) {}
  syncThemeIcons();
}
syncThemeIcons();
if (window.matchMedia) { try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncThemeIcons); } catch (e) {} }
